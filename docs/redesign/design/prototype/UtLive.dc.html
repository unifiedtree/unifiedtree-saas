<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./hrms-fx.js"></script></helmet>
<sc-if value="{{ row }}" hint-placeholder-val="{{ true }}"><div data-fx="tilt" data-rise="" role="button" tabindex="0" onClick="{{ go }}" style="position:relative;height:100%;min-height:124px;box-sizing:border-box;padding:18px;border-radius:18px;background:var(--u-sf,#fff);border:1px solid color-mix(in oklab,var(--k,#0F6E56) 26%,var(--u-sf,#fff));box-shadow:0 1px 2px rgba(14,27,22,.04);display:flex;align-items:center;gap:16px;cursor:pointer;overflow:hidden;outline:none;font-family:var(--u-font,'Geist',system-ui,sans-serif);color:var(--u-ink,#0E1B16);font-variant-numeric:tabular-nums;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(calc(var(--fx,0) * -4px));transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease,border-color .5s ease" style-hover="border-color:color-mix(in oklab,var(--k,#0F6E56) 55%,var(--u-sf,#fff));box-shadow:0 26px 46px -28px color-mix(in oklab,var(--k,#0F6E56) 85%,transparent),0 2px 8px -3px color-mix(in oklab,var(--k,#0F6E56) 30%,transparent)" style-focus="box-shadow:0 0 0 3px color-mix(in oklab,var(--k,#0F6E56) 30%,transparent)">
<span aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;opacity:var(--fx,0);transition:opacity .5s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),color-mix(in oklab,var(--k,#0F6E56) 12%,transparent),transparent 50%),linear-gradient(180deg,color-mix(in oklab,var(--k,#0F6E56) 6%,transparent),transparent 70%)"></span>
<span aria-hidden="true" style="position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:var(--fxr,0);transition:opacity .45s;background:conic-gradient(from var(--ang,0deg),transparent 0deg 200deg,color-mix(in oklab,var(--k,#0F6E56) 35%,transparent) 250deg,var(--k,#0F6E56) 305deg,color-mix(in oklab,var(--k,#0F6E56) 40%,#fff) 335deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude"></span>
<span style="position:relative;width:50px;height:50px;flex-shrink:0;border-radius:15px;background:color-mix(in oklab,var(--k,#0F6E56) 11%,var(--u-sf,#fff));color:var(--k,#0F6E56);display:flex;align-items:center;justify-content:center;transform:scale(calc(1 + var(--fx,0) * .06));transition:transform .55s cubic-bezier(.34,1.56,.64,1)"><span aria-hidden="true" style="position:absolute;inset:0;border-radius:inherit;border:1.5px solid currentColor;opacity:calc(var(--fx,0) * .3);transform:scale(calc(1 + var(--fx,0) * .24));transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .45s"></span><dc-import name="UtAniIcon" kind="{{ kind }}" style="display:block;width:24px;height:24px" hint-size="24px,24px"></dc-import></span>
<div style="position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
<div style="font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</div>
<div data-count="" style="font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.035em;white-space:nowrap">{{ value }}</div>
<div style="font-size:13px;line-height:18px;color:var(--u-ink2,#4A5A54);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ note }}</div>
</div>
<sc-if value="{{ hasSpark }}" hint-placeholder-val="{{ true }}"><svg width="84" height="34" viewBox="0 0 84 34" fill="none" aria-hidden="true" style="position:relative;flex-shrink:1;min-width:44px;align-self:flex-end;margin-bottom:6px;overflow:visible;color:var(--k,#0F6E56)"><path d="{{ area }}" fill="currentColor" fill-opacity=".1"></path><path data-draw="" d="{{ line }}" pathLength="1" stroke-dasharray="1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="{{ dx }}" cy="{{ dy }}" r="3.2" stroke="currentColor" stroke-width="1.9" style="fill:var(--u-sf,#fff);transform-box:fill-box;transform-origin:center;transform:scale(calc(1 + var(--fx,0) * .5));transition:transform .45s cubic-bezier(.34,1.56,.64,1)"></circle></svg></sc-if>
<sc-if value="{{ flat }}"><svg width="84" height="34" viewBox="0 0 84 34" fill="none" aria-hidden="true" style="position:relative;flex-shrink:1;min-width:44px;align-self:flex-end;margin-bottom:6px;overflow:visible;color:var(--k,#0F6E56)"><path d="M2 30H82" stroke="currentColor" stroke-opacity=".45" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 5"></path><circle cx="82" cy="30" r="3" stroke="currentColor" stroke-opacity=".6" stroke-width="1.8" style="fill:var(--u-sf,#fff)"></circle></svg></sc-if>
</div></sc-if>
<sc-if value="{{ stack }}"><div data-fx="tilt" data-rise="" role="button" tabindex="0" onClick="{{ go }}" style="position:relative;height:100%;min-height:140px;box-sizing:border-box;padding:16px 16px 15px;border-radius:18px;background:var(--u-sf,#fff);border:1px solid color-mix(in oklab,var(--k,#0F6E56) 26%,var(--u-sf,#fff));box-shadow:0 1px 2px rgba(14,27,22,.04);display:flex;flex-direction:column;justify-content:space-between;gap:12px;cursor:pointer;overflow:hidden;outline:none;font-family:var(--u-font,'Geist',system-ui,sans-serif);color:var(--u-ink,#0E1B16);font-variant-numeric:tabular-nums;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(calc(var(--fx,0) * -4px));transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease,border-color .5s ease" style-hover="border-color:color-mix(in oklab,var(--k,#0F6E56) 55%,var(--u-sf,#fff));box-shadow:0 26px 46px -28px color-mix(in oklab,var(--k,#0F6E56) 85%,transparent),0 2px 8px -3px color-mix(in oklab,var(--k,#0F6E56) 30%,transparent)" style-focus="box-shadow:0 0 0 3px color-mix(in oklab,var(--k,#0F6E56) 30%,transparent)">
<span aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;opacity:var(--fx,0);transition:opacity .5s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in oklab,var(--k,#0F6E56) 12%,transparent),transparent 50%),linear-gradient(180deg,color-mix(in oklab,var(--k,#0F6E56) 6%,transparent),transparent 70%)"></span>
<span aria-hidden="true" style="position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:var(--fxr,0);transition:opacity .45s;background:conic-gradient(from var(--ang,0deg),transparent 0deg 200deg,color-mix(in oklab,var(--k,#0F6E56) 35%,transparent) 250deg,var(--k,#0F6E56) 305deg,color-mix(in oklab,var(--k,#0F6E56) 40%,#fff) 335deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude"></span>
<div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><span style="position:relative;width:42px;height:42px;flex-shrink:0;border-radius:13px;background:color-mix(in oklab,var(--k,#0F6E56) 11%,var(--u-sf,#fff));color:var(--k,#0F6E56);display:flex;align-items:center;justify-content:center;transform:scale(calc(1 + var(--fx,0) * .06));transition:transform .55s cubic-bezier(.34,1.56,.64,1)"><span aria-hidden="true" style="position:absolute;inset:0;border-radius:inherit;border:1.5px solid currentColor;opacity:calc(var(--fx,0) * .3);transform:scale(calc(1 + var(--fx,0) * .24));transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .45s"></span><dc-import name="UtAniIcon" kind="{{ kind }}" style="display:block;width:21px;height:21px" hint-size="21px,21px"></dc-import></span><sc-if value="{{ hasSpark }}" hint-placeholder-val="{{ true }}"><svg width="70" height="30" viewBox="0 0 84 34" fill="none" aria-hidden="true" style="flex-shrink:1;min-width:40px;overflow:visible;color:var(--k,#0F6E56)"><path d="{{ area }}" fill="currentColor" fill-opacity=".1"></path><path data-draw="" d="{{ line }}" pathLength="1" stroke-dasharray="1" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="{{ dx }}" cy="{{ dy }}" r="3.4" stroke="currentColor" stroke-width="2.1" style="fill:var(--u-sf,#fff);transform-box:fill-box;transform-origin:center;transform:scale(calc(1 + var(--fx,0) * .5));transition:transform .45s cubic-bezier(.34,1.56,.64,1)"></circle></svg></sc-if><sc-if value="{{ flat }}"><svg width="70" height="30" viewBox="0 0 84 34" fill="none" aria-hidden="true" style="flex-shrink:1;min-width:40px;overflow:visible;color:var(--k,#0F6E56)"><path d="M2 30H82" stroke="currentColor" stroke-opacity=".45" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 5"></path></svg></sc-if></div>
<div style="position:relative;display:flex;flex-direction:column;gap:1px;min-width:0">
<div style="font-size:13.5px;line-height:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</div>
<div data-count="" style="font-size:27px;line-height:33px;font-weight:600;letter-spacing:-.035em;white-space:nowrap">{{ value }}</div>
<div style="font-size:12.5px;line-height:17px;color:var(--u-ink2,#4A5A54);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ note }}</div>
</div>
</div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:140},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Present&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;142&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;59% of 241 scheduled&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;users&quot;,&quot;present&quot;,&quot;leave&quot;,&quot;late&quot;,&quot;half&quot;,&quot;wfh&quot;,&quot;none&quot;,&quot;absent&quot;],&quot;default&quot;:&quot;present&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;row&quot;,&quot;stack&quot;],&quot;default&quot;:&quot;row&quot;,&quot;tsType&quot;:&quot;'row' | 'stack'&quot;},&quot;spark&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;144,139,150,146,148,145,142&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dot&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;go&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const LV_W = 84, LV_H = 34, LV_P = 4;
const lvSmooth = xy => xy.reduce((s, p, i, a) => {
  const f = n => n.toFixed(1);
  if (!i) return 'M' + f(p[0]) + ' ' + f(p[1]);
  const p0 = a[i - 1], pm = a[i - 2] || p0, pn = a[i + 1] || p;
  return s + ' C' + f(p0[0] + (p[0] - pm[0]) / 6) + ' ' + f(p0[1] + (p[1] - pm[1]) / 6) + ' ' + f(p[0] - (pn[0] - p0[0]) / 6) + ' ' + f(p[1] - (pn[1] - p0[1]) / 6) + ' ' + f(p[0]) + ' ' + f(p[1]);
}, '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props, pts = String(p.spark || '').split(',').map(Number).filter(n => !isNaN(n));
    const flat = pts.length < 2 || Math.max(...pts) === Math.min(...pts);
    let line = '', area = '', dx = 0, dy = 0;
    if (!flat) {
      const mn = Math.min(...pts), mx = Math.max(...pts);
      const xy = pts.map((v, i) => [2 + i * (LV_W - 4) / (pts.length - 1), LV_H - LV_P - (v - mn) / (mx - mn) * (LV_H - LV_P * 2)]);
      line = lvSmooth(xy); area = line + ' L' + (LV_W - 2) + ' ' + LV_H + ' L2 ' + LV_H + ' Z';
      const di = Math.max(0, Math.min(xy.length - 1, p.dot == null ? xy.length - 1 : Number(p.dot))); dx = xy[di][0]; dy = xy[di][1];
    }
    const stack = p.layout === 'stack';
    return {
      row: !stack, stack, kind: p.kind || 'users', label: p.label || '', value: p.value == null ? '' : String(p.value), note: p.note || '',
      hasSpark: !flat, flat, line, area, dx, dy,
      go: () => { if (p.go) p.go(); }
    };
  }
}
</script>
</body>
</html>
