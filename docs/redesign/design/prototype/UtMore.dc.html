<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./hrms-core.js"></script><script src="./hrms-fx.js"></script></helmet>
<div data-pop="left" role="dialog" aria-label="More" style="width:320px;max-width:calc(100vw - 88px);height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:var(--u-sf,#fff);color:var(--u-ink,#0E1B16);font-family:var(--u-font,'Geist',system-ui,sans-serif);border-radius:0;box-shadow:28px 0 60px -32px rgba(14,27,22,.5);overflow:hidden">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 20px 14px 24px"><div style="flex:1;min-width:0;white-space:nowrap"><div style="font-size:23px;line-height:28px;font-weight:600;letter-spacing:-.02em">More</div><div style="margin-top:2px;font-size:13.5px;color:var(--u-ink3,#6A7A73)">Quick access &amp; settings</div></div><button type="button" onClick="{{ close }}" aria-label="Close" title="Close (Esc)" style="width:36px;height:36px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:var(--u-ink2,#4A5A54);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--u-hv,#F0F4F2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:4px 18px 14px;display:flex;flex-direction:column">
<div style="display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px;border-radius:20px;background:linear-gradient(140deg,#E3F1EA,#F1F8F4)">
<button type="button" onClick="{{ profile }}" style="display:flex;align-items:center;gap:14px;padding:0 4px;border:0;background:transparent;font-family:inherit;color:inherit;text-align:left;cursor:pointer"><span style="position:relative;width:54px;height:54px;flex-shrink:0;border-radius:50%;background:#0F6E56;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;box-shadow:0 0 0 3px #fff">{{ uIni }}<span style="position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#22B573;box-shadow:0 0 0 2.5px #fff"></span></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ uName }}</span><span style="font-size:12.5px;color:var(--u-ink2,#4A5A54);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ uRole }}</span><span style="font-size:12.5px;color:var(--u-ink3,#6A7A73)">Demo Technologies</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--u-ink2,#4A5A54)"><path d="m9 18 6-6-6-6"></path></svg></button>
<button type="button" onClick="{{ profile }}" style="height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;border:0;border-radius:12px;background:#fff;color:#0E1B16;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(14,27,22,.06)" style-hover="color:#0F6E56"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg><span style="flex:1;text-align:left">View my profile</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<div style="display:flex;flex-direction:column;margin-top:6px">
<sc-for list="{{ secs }}" as="g" hint-placeholder-count="4"><div style="display:flex;flex-direction:column">
<sc-if value="{{ g.sep }}"><div style="height:1px;margin:10px 10px 0;background:var(--u-ln2,#EDF1EF)"></div></sc-if>
<div style="margin:18px 10px 6px;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--u-ink3,#6A7A73)">{{ g.label }}</div>
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3"><button type="button" onClick="{{ r.go }}" style="position:relative;width:100%;height:46px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 10px;border:0;border-radius:12px;background:transparent;font-family:inherit;font-size:14.5px;color:inherit;text-align:left;cursor:pointer;transition:background .2s,color .2s" style-hover="background:#EEF6F2;color:#0F6E56"><sc-if value="{{ r.on }}"><span style="position:absolute;inset:0;border-radius:12px;background:#E8F3EE"></span></sc-if><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:relative;flex-shrink:0"><path d="{{ r.d }}"></path></svg><span style="position:relative;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.t }}</span><sc-if value="{{ r.hasBadge }}"><span style="position:relative;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#D99A2B;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ r.badge }}</span></sc-if><sc-if value="{{ r.soon }}"><span style="position:relative;font-size:11px;font-weight:500;color:var(--u-ink3,#6A7A73);background:var(--u-hv,#F0F4F2);border-radius:999px;padding:0 8px;line-height:20px">Soon</span></sc-if><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:relative;flex-shrink:0;color:var(--u-ink3,#6A7A73)"><path d="m9 18 6-6-6-6"></path></svg></button></sc-for>
</div></sc-for>
</div>
</div>
<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 20px 20px;box-shadow:inset 0 1px 0 var(--u-ln2,#EDF1EF)">
<div role="group" aria-label="Theme" style="display:flex;padding:4px;border-radius:999px;background:var(--u-hv,#F0F4F2)">
<sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><span style="height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-radius:999px;background:var(--u-sf,#fff);color:#0F6E56;font-size:13.5px;font-weight:500;box-shadow:0 1px 3px rgba(14,27,22,.12)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>Light</span><button type="button" onClick="{{ theme }}" style="height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--u-ink2,#4A5A54);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>Dark</button></sc-if>
<sc-if value="{{ isDark }}"><button type="button" onClick="{{ theme }}" style="height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--u-ink2,#4A5A54);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>Light</button><span style="height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-radius:999px;background:var(--u-sf,#fff);color:var(--u-brt,#0F6E56);font-size:13.5px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.3)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>Dark</span></sc-if>
</div>
<button type="button" onClick="{{ signOut }}" style="height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#D0342C;font-family:inherit;font-size:14.5px;font-weight:500;cursor:pointer" style-hover="background:#FDECEA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Sign out</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:900},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{ key: string; label: string; modules: Array&lt;{ key: string; label: string; d: string; soon?: boolean; go: () =&gt; void; pages: Array&lt;{ label: string; go: () =&gt; void }&gt; }&gt; }&gt;&quot;},&quot;unread&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;isDark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;curMod&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Demo Owner&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;HR admin · Owner&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userIni&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onGo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Function&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onProfile&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSettings&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onMe&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onBell&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSignOut&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onHelp&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(msg: string) =&gt; void&quot;}}">
const MR_IC = {
  grid: 'M4 3h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 14h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zM4 14h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z',
  user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  bell: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0',
  gear: 'M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  help: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01'
};
class Component extends DCLogic {
  state = { q: '' };
  renderVals() {
    const p = this.props, s = this.state, call = (f, ...a) => () => { if (f) f(...a); };
    const groups = p.groups || [], q = s.q.trim().toLowerCase(), unread = Number(p.unread) || 0;
    const row = (t, d, go, extra) => Object.assign({ t, d, go, on: false, hasBadge: false, badge: '', soon: false }, extra || {});
    const secs = [{ label: 'My space', rows: [row('My workspace', MR_IC.grid, call(p.onMe)), row('My profile', MR_IC.user, call(p.onProfile))] }]
      .concat(groups.filter(g => g.key !== 'apps').map(g => ({ label: g.label, rows: (g.modules || []).filter(m => !m.soon).map(m => row(m.label, m.d, m.go, { on: m.key === p.curMod })) })).filter(g => g.rows.length))
      .concat([{ label: 'Settings', rows: [row('Preferences', MR_IC.gear, call(p.onSettings)), row('Help & support', MR_IC.help, call(p.onHelp))] }])
      .map((g, i) => Object.assign(g, { sep: i > 0 }));
    const hits = [];
    if (q) {
      secs.forEach(g => g.rows.forEach(r => { if (r.t.toLowerCase().includes(q)) hits.push({ t: r.t, s: g.label, d: r.d, go: r.go }); }));
      groups.forEach(g => (g.modules || []).forEach(m => (m.pages || []).forEach(x => { if (x.label.toLowerCase().includes(q) && x.label !== m.label) hits.push({ t: x.label, s: m.label, d: m.d, go: x.go }); })));
    }
    return {
      uName: p.userName || 'Demo Owner', uRole: p.userTitle || p.userRole || 'HR admin', uIni: p.userIni || 'DO',
      q: s.q, setQ: e => this.setState({ q: e.target.value }), searching: !!q, notSearching: !q, hits, noHits: !!q && !hits.length,
      secs, isDark: !!p.isDark, isLight: !p.isDark,
      close: call(p.onClose), profile: call(p.onProfile), theme: call(p.onTheme), signOut: call(p.onSignOut)
    };
  }
}
</script>
</body>
</html>
