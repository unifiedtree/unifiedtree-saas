<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="position:relative;display:flex;width:100%;height:100%;align-items:center;justify-content:center">
<sc-if value="{{ kUsers }}" hint-placeholder-val="{{ true }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><g style="transform:translateX(calc(var(--fx,0) * -1px));transition:transform .55s cubic-bezier(.34,1.56,.64,1)"><circle cx="9" cy="8" r="3.6"></circle><path d="M2.5 20v-1.2A4.8 4.8 0 0 1 7.3 14h3.4a4.8 4.8 0 0 1 4.8 4.8V20"></path></g><g style="opacity:calc(1 - var(--fx,0) * .2);transform:translateX(calc(var(--fx,0) * 1.8px));transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .35s"><path d="M15.5 4.6a3.6 3.6 0 0 1 0 6.8"></path><path d="M18.5 14.4a4.8 4.8 0 0 1 3 4.4V20"></path></g><g style="transform-box:fill-box;transform-origin:center;transform:scale(var(--fx,0)) rotate(calc(var(--fx,0) * 90deg));opacity:var(--fx,0);transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .3s"><circle cx="20.5" cy="4" r="3.6" fill="currentColor" stroke="none"></circle><path d="M20.5 2.4v3.2M18.9 4h3.2" stroke="#fff" stroke-width="1.6"></path></g></svg></sc-if>
<sc-if value="{{ kPresent }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><circle cx="9" cy="8" r="3.6"></circle><path d="M2.5 20v-1.2A4.8 4.8 0 0 1 7.3 14h3.4a4.8 4.8 0 0 1 4.8 4.8V20"></path><path data-draw="" d="M15.4 11.4l2.3 2.3 4.5-4.8" pathLength="1" stroke-dasharray="1" stroke-width="2.3" style="transform-box:fill-box;transform-origin:center;transform:scale(calc(1 + var(--fx,0) * .2));transition:transform .55s cubic-bezier(.34,1.56,.64,1)"></path></svg></sc-if>
<sc-if value="{{ kLeave }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><g style="transform-box:fill-box;transform-origin:center;transform:translate(calc(var(--fx,0) * 2.6px),calc(var(--fx,0) * -2.6px)) rotate(calc(var(--fx,0) * -6deg));transition:transform .65s cubic-bezier(.34,1.56,.64,1)"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></g><path d="M1.5 22.5h4.5M1 19.5h2.5" stroke-dasharray="2 2" style="opacity:var(--fx,0);transform:translateX(calc((1 - var(--fx,0)) * 3px));transition:opacity .3s,transform .55s cubic-bezier(.2,.8,.2,1)"></path></svg></sc-if>
<sc-if value="{{ kLate }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><g style="transform-origin:12px 13px;transform:rotate(calc(var(--fx,0) * -12deg));transition:transform .5s cubic-bezier(.34,1.56,.64,1)"><circle cx="12" cy="13" r="8"></circle><path d="M5 3 2 6M22 6l-3-3M6.4 19.6 4.6 21.4M17.6 19.6l1.8 1.8"></path><g style="transform-origin:12px 13px;transform:rotate(calc(var(--fx,0) * 300deg));transition:transform 1.1s cubic-bezier(.65,0,.35,1)"><path d="M12 13V8.4" stroke-width="2.1"></path></g><path d="M12 13l2.7 1.6" stroke-width="2.1"></path></g><path d="M.8 9.6l1.6.6M23.2 9.6l-1.6.6M12 1.2v1.4" style="opacity:var(--fx,0);transition:opacity .3s .1s"></path></svg></sc-if>
<sc-if value="{{ kHalf }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><g style="transform-origin:12px 12px;transform:rotate(calc(var(--fx,0) * 180deg));transition:transform .85s cubic-bezier(.65,0,.35,1)"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" style="fill-opacity:calc(.22 + var(--fx,0) * .5);transition:fill-opacity .5s"></path><path d="M12 3v18"></path></g></svg></sc-if>
<sc-if value="{{ kWfh }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path><rect x="9.6" y="15.4" width="4.8" height="5.2" rx=".6" stroke="none" fill="#E8B04B" style="opacity:calc(var(--fx,0) * .95);transition:opacity .4s"></rect><path d="M16.5 6.2V3.4h2.6v5"></path><path d="M17.8 1.6c-.9-.9.9-1.3 0-2.2" stroke-width="1.4" style="opacity:var(--fx,0);transform:translateY(calc((1 - var(--fx,0)) * 2px));transition:opacity .45s .12s,transform .6s .12s"></path></svg></sc-if>
<sc-if value="{{ kNone }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><circle cx="12" cy="12" r="9.5" stroke-dasharray="3.2 2.4" style="transform-origin:12px 12px;transform:rotate(calc(var(--fx,0) * 120deg));transition:transform 1s cubic-bezier(.2,.8,.2,1)"></circle><g style="transform:translateY(calc(var(--fx,0) * -1.8px));transition:transform .5s cubic-bezier(.34,1.56,.64,1)"><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.6-2.8 2.6"></path><path d="M12 16.6h.01" stroke-width="2.6"></path></g></svg></sc-if>
<sc-if value="{{ kAbsent }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><g style="opacity:calc(1 - var(--fx,0) * .35);transition:opacity .4s"><circle cx="9" cy="8" r="3.6"></circle><path d="M2.5 20v-1.2A4.8 4.8 0 0 1 7.3 14h3.4a4.8 4.8 0 0 1 4.8 4.8V20"></path></g><path data-draw="" d="M16.8 8.4l4.6 4.6" pathLength="1" stroke-dasharray="1" stroke-width="2.2"></path><path data-draw="" d="M21.4 8.4 16.8 13" pathLength="1" stroke-dasharray="1" stroke-width="2.2"></path></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:64,&quot;height&quot;:64},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;users&quot;,&quot;present&quot;,&quot;leave&quot;,&quot;late&quot;,&quot;half&quot;,&quot;wfh&quot;,&quot;none&quot;,&quot;absent&quot;],&quot;default&quot;:&quot;users&quot;,&quot;tsType&quot;:&quot;'users' | 'present' | 'leave' | 'late' | 'half' | 'wfh' | 'none' | 'absent'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'users';
    return { kUsers: k === 'users', kPresent: k === 'present', kLeave: k === 'leave', kLate: k === 'late', kHalf: k === 'half', kWfh: k === 'wfh', kNone: k === 'none', kAbsent: k === 'absent' };
  }
}
</script>
</body>
</html>
