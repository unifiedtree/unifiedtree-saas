<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./hrms-data.js"></script><script src="./hrms-fx.js"></script></helmet>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;font-family:var(--u-font,'Geist',system-ui,sans-serif);color:var(--u-ink,#0E1B16)">
<sc-for list="{{ secs }}" as="c" hint-placeholder-count="3"><section data-rise="" aria-label="{{ c.title }}" style="flex:1 1 440px;min-width:0;background:var(--u-sf,#fff);border:1px solid var(--u-ln,#E3E9E6);border-radius:18px;box-shadow:var(--u-shc,0 1px 2px rgba(14,27,22,.05));overflow:hidden">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 10px 20px"><div style="min-width:0"><div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;color:inherit;font-size:15px;line-height:20px;font-weight:500">{{ c.title }}</h2><sc-if value="{{ c.hasN }}"><span style="font-size:12px;font-weight:500;color:var(--u-brt,#0F6E56);background:var(--u-brs,#E8F3EE);border-radius:999px;padding:0 8px;line-height:20px">{{ c.n }}</span></sc-if></div><sc-if value="{{ c.hasSub }}"><p style="margin:2px 0 0;font-size:12.5px;line-height:17px;color:var(--u-ink3,#6A7A73)">{{ c.sub }}</p></sc-if></div><sc-if value="{{ c.hasAct }}"><button type="button" onClick="{{ c.go }}" style="height:30px;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--u-ln,#E3E9E6);border-radius:9px;background:var(--u-sf,#fff);color:var(--u-brt,#0F6E56);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:border-color .2s,background .2s" style-hover="border-color:var(--u-brl,#BFDFD1);background:var(--u-brs,#E8F3EE)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ c.actD }}"></path></svg>{{ c.act }}</button></sc-if></div>
<sc-if value="{{ c.isKv }}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px 18px;padding:6px 20px 20px"><sc-for list="{{ c.kv }}" as="f" hint-placeholder-count="6"><div style="min-width:0"><div style="font-size:12px;color:var(--u-ink3,#6A7A73)">{{ f.k }}</div><div style="margin-top:2px;font-size:14px;line-height:20px;font-weight:500;text-wrap:pretty;overflow-wrap:anywhere">{{ f.v }}</div></div></sc-for></div></sc-if>
<sc-if value="{{ c.isRows }}"><div style="display:flex;flex-direction:column;padding:0 8px 10px"><sc-for list="{{ c.rows }}" as="r" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;transition:background .2s" style-hover="background:var(--u-sf2,#F7F9F8)"><span style="width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--u-brs,#E8F3EE);color:var(--u-brt,#0F6E56);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">{{ r.ic }}</span><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.t }}</div><div style="margin-top:1px;font-size:12.5px;color:var(--u-ink3,#6A7A73);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.s }}</div><sc-if value="{{ r.hasBar }}"><span style="display:block;margin-top:7px;height:6px;border-radius:3px;background:var(--u-hv,#F0F4F2);overflow:hidden"><svg data-grow="x" aria-hidden="true" width="{{ r.bar }}" style="display:block;height:100%;border-radius:3px;background:#0F6E56;transform-origin:left;min-width:0"></svg></span></sc-if></div><sc-if value="{{ r.hasM }}"><span style="flex-shrink:0;font-size:12.5px;font-weight:500;color:var(--u-ink2,#4A5A54);white-space:nowrap">{{ r.m }}</span></sc-if><sc-if value="{{ r.pOk }}"><span style="flex-shrink:0;font-size:12px;font-weight:500;line-height:22px;padding:0 9px;border-radius:999px;background:var(--u-brs,#E8F3EE);color:var(--u-brt,#0F6E56);white-space:nowrap">{{ r.st }}</span></sc-if><sc-if value="{{ r.pWarn }}"><span style="flex-shrink:0;font-size:12px;font-weight:500;line-height:22px;padding:0 9px;border-radius:999px;background:var(--u-gds,#FAF1E1);color:var(--u-gdt,#8A5A10);white-space:nowrap">{{ r.st }}</span></sc-if><sc-if value="{{ r.pBad }}"><span style="flex-shrink:0;font-size:12px;font-weight:500;line-height:22px;padding:0 9px;border-radius:999px;background:var(--u-rds,#FCEDEB);color:var(--u-rdt,#B42318);white-space:nowrap">{{ r.st }}</span></sc-if><sc-if value="{{ r.pGray }}"><span style="flex-shrink:0;font-size:12px;font-weight:500;line-height:22px;padding:0 9px;border-radius:999px;background:var(--u-hv,#F0F4F2);color:var(--u-ink2,#4A5A54);white-space:nowrap">{{ r.st }}</span></sc-if><sc-for list="{{ r.acts }}" as="a" hint-placeholder-count="0"><button type="button" onClick="{{ a.go }}" style="height:30px;flex-shrink:0;padding:0 10px;border:1px solid var(--u-ln,#E3E9E6);border-radius:8px;background:var(--u-sf,#fff);color:var(--u-ink2,#4A5A54);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="border-color:var(--u-brl,#BFDFD1);color:var(--u-brt,#0F6E56)">{{ a.label }}</button></sc-for></div></sc-for></div></sc-if>
<sc-if value="{{ c.isSteps }}"><div style="display:flex;flex-direction:column;padding:4px 20px 16px"><sc-for list="{{ c.rows }}" as="r" hint-placeholder-count="4"><div style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-top:4px"><sc-if value="{{ r.done }}" hint-placeholder-val="{{ true }}"><span style="width:12px;height:12px;border-radius:50%;background:#0F6E56;box-shadow:0 0 0 3px var(--u-brs,#E8F3EE)"></span></sc-if><sc-if value="{{ r.todo }}"><span style="width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:2px solid var(--u-ln,#E3E9E6);background:var(--u-sf,#fff)"></span></sc-if><span style="flex:1;width:2px;min-height:18px;margin:4px 0;background:var(--u-ln,#E3E9E6)"></span></div><div style="padding-bottom:12px;min-width:0"><div style="font-size:13.5px;font-weight:500">{{ r.t }}</div><div style="font-size:12.5px;color:var(--u-ink3,#6A7A73)">{{ r.s }}</div></div></div></sc-for></div></sc-if>
<sc-if value="{{ c.isChips }}"><div style="display:flex;flex-wrap:wrap;gap:6px;padding:4px 20px 18px"><sc-for list="{{ c.chips }}" as="x" hint-placeholder-count="5"><span style="height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:999px;background:var(--u-brs,#E8F3EE);color:var(--u-brt,#0F6E56);font-size:12.5px;font-weight:500">{{ x }}</span></sc-for></div></sc-if>
<sc-if value="{{ c.isEmpty }}"><div style="margin:4px 16px 16px;padding:22px 16px;border-radius:14px;border:1.5px dashed var(--u-ln,#E3E9E6);background:var(--u-sf2,#F7F9F8);text-align:center;font-size:13px;color:var(--u-ink2,#4A5A54)">{{ c.empty }}</div></sc-if>
</section></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:900},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;personal&quot;,&quot;job&quot;,&quot;leave&quot;,&quot;expenses&quot;,&quot;documents&quot;,&quot;letters&quot;,&quot;performance&quot;,&quot;exit&quot;],&quot;default&quot;:&quot;personal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;code&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;EMP-0101&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(msg: string) =&gt; void&quot;}}">
const PT_PLUS = 'M12 5v14M5 12h14', PT_EDIT = 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z';
const PT_TONE = { ok: 'pOk', mint: 'pOk', warn: 'pWarn', bad: 'pBad', gray: 'pGray', info: 'pGray' };
class Component extends DCLogic {
  state = { docs: {}, sep: false };
  componentDidMount() { if (!window.UTD) this.t = setInterval(() => { if (window.UTD) { clearInterval(this.t); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const p = this.props, D = window.UTD, s = this.state, toast = m => { if (p.onToast) p.onToast(m); };
    if (!D) return { secs: [] };
    const e = D.people.find(x => x.code === p.code) || D.people[0], first = e.name.split(' ')[0];
    const kv = (title, sub, pairs, act, basis) => ({ kind: 'kv', title, sub, basis: basis || '100%', act, kv: pairs.map(([k, v]) => ({ k, v: v || '—' })) });
    const rows = (title, sub, list, act, basis, n) => ({ kind: 'rows', title, sub, basis: basis || '100%', act, n, rows: list });
    const row = (ic, t, sub, m, st, tone, acts) => { const r = { ic, t, s: sub, m: m || '', hasM: !!m, st: st || '', hasBar: false, bar: '', acts: acts || [], pOk: false, pWarn: false, pBad: false, pGray: false }; if (st) r[PT_TONE[tone] || 'pGray'] = true; return r; };
    const add = label => ({ label, go: () => toast(label + ' for ' + first) });
    const tabs = {
      personal: [
        kv('Contact & addresses', 'How to reach ' + first, [['Work email', e.email], ['Phone', '+91 98450 21734'], ['Date of birth', '14 Aug 1996'], ['Gender', 'Female'], ['Current address', '42, 3rd Cross, HSR Layout Sector 2, Bengaluru, Karnataka 560102'], ['Permanent address', '11 Prabhat Road, Pune, Maharashtra 411004']], add('Add Address')),
        kv('Identity documents', 'Masked. Only HR admins can reveal them', [['PAN', 'ABCPS1234K'], ['Aadhaar', '•••• •••• 4821'], ['UAN', '100 482 173 921'], ['ESIC Number', 'Not applicable'], ['Passport Number', 'P4821773'], ['Passport Expiry', '14 Feb 2031']], null, '48%'),
        rows('Education', '', [row('ED', 'B.Tech · Computer Science', 'PES University, Bengaluru', '2014 – 2018', '8.4 CGPA', 'gray')], add('Add Education'), '48%'),
        rows('Work experience', '', [row('WX', 'Software Engineer · Infosys', 'Mysuru · Built the leave and payroll APIs', 'Jun 2018 – Feb 2022')], add('Add Experience'), '48%'),
        rows('Dependents', 'Nominee share must add up to 100%', [row('AS', 'Anil Sharma · Father', 'Born 12 Jan 1962', '', 'Nominee 50%', 'ok'), row('SS', 'Sunita Sharma · Mother', 'Born 3 Jun 1965', '', 'Nominee 50%', 'ok')], add('Add Dependent'), '48%'),
        rows('Emergency contacts', '', [row('RS', 'Rohit Sharma · Brother', '+91 98860 21733 · rohit.s@gmail.com')], add('Add Emergency Contact'))
      ],
      job: [
        kv('Employment details', '', [['Department', e.dept], ['Designation', e.role], ['Branch', e.branch], ['Employment type', e.type], ['CTC (annual)', '₹18,57,000'], ['Joining date', e.joined], ['Confirmation date', '12 Sep 2022'], ['Probation end', '12 Sep 2022'], ['Last working day', '—']], add('Edit Work Details')),
        rows('Reporting line', '', [row('↑', e.mgr, 'Reports to · Engineering Manager', '', 'Manager', 'ok'), row('KM', 'Kavya Menon', 'Direct report · Engineer'), row('AR', 'Aditya Rao', 'Direct report · SDE II · on probation', '', 'Probation', 'warn')], null, '48%'),
        kv('Assigned shift', '', [['Shift', e.shift.split(' · ')[0]], ['Timing', (e.shift.split(' · ')[1] || '') + ' · 15 min grace'], ['Next shift', 'Same from Mon, 28 Sep']], { label: 'Change shift', go: () => toast('Change shift for ' + first) }, '48%')
      ],
      leave: [
        kv('Balances', 'Available after pending requests', [['Casual leave', '4.5 of 12'], ['Earned leave', '9 of 15'], ['Sick leave', '6 of 8'], ['Comp-off', '1 of 1']], add('Apply on behalf')),
        rows('Leave requests', 'Newest first, with where each one stands.', [row('CL', 'Casual leave · 2 days', '28–29 Sep · Family function in Pune', '12 min ago', 'Pending', 'warn', [{ label: 'Approve', go: () => toast('Approved ' + first + '’s casual leave') }]), row('SL', 'Sick leave · 1 day', 'Thu, 3 Sep · Fever', '4 Sep', 'Approved', 'ok'), row('EL', 'Earned leave · 5 days', '10–14 Aug · Trip to Coorg', '20 Jul', 'Approved', 'ok'), row('CL', 'Casual leave · 1 day', 'Fri, 17 Jul', '15 Jul', 'Rejected', 'bad')], null, '100%', '4')
      ],
      expenses: [rows('Expense claims', 'Submitted by ' + first + ' this year', [row('₹', 'Client visit travel · ₹4,860', 'Mon, 21 Sep · Cab and meals', '', 'Pending', 'warn'), row('₹', 'Team lunch · ₹2,150', 'Fri, 4 Sep', '', 'Approved', 'ok'), row('₹', 'Home internet · ₹999', 'August', '', 'Reimbursed', 'gray')], add('New claim'))],
      documents: [rows('Filed documents', 'Verify each one before payroll uses it', [['PAN card', 'Uploaded 14 Mar 2022', 'Verified', 'ok'], ['Aadhaar card', 'Uploaded 14 Mar 2022', 'Verified', 'ok'], ['Address proof', 'Rental agreement · uploaded 21 Sep', 'Pending', 'warn'], ['Degree certificate', 'Uploaded 21 Sep', 'Pending', 'warn'], ['Relieving letter · Infosys', 'Uploaded 14 Mar 2022', 'Verified', 'ok'], ['Driving licence', 'Expired 2 Aug 2026', 'Expired', 'bad']].map(([t, sub, st, tone], i) => { const d = s.docs[i]; const fin = d ? (d === 'ok' ? ['Verified', 'ok'] : ['Rejected', 'bad']) : [st, tone]; return row('DOC', t, sub, '', fin[0], fin[1], !d && st === 'Pending' ? [{ label: 'Reject', go: () => { this.setState({ docs: Object.assign({}, this.state.docs, { [i]: 'no' }) }); toast(t + ' rejected'); } }, { label: 'Mark verified', go: () => { this.setState({ docs: Object.assign({}, this.state.docs, { [i]: 'ok' }) }); toast(t + ' verified'); } }] : []); }), add('Upload'), '100%', '6')],
      letters: [rows('Generated Letters', '', [['Offer letter', 'Signed 2 Mar 2022'], ['Appointment letter', 'Issued 12 Mar 2022'], ['Confirmation letter', 'Issued 12 Sep 2022'], ['Salary revision · FY 2026–27', 'Issued 1 Apr 2026']].map(([t, sub]) => row('PDF', t, sub, '', '', '', [{ label: 'Download', go: () => toast('Downloading ' + t) }])), add('Generate letter'))],
      performance: [
        rows('Goals & KPIs', 'What this employee is currently measured on.', [['Ship payroll automation', 72], ['Cut API p95 latency to 200 ms', 55], ['Mentor two new joiners', 100]].map(([t, pct]) => Object.assign(row('KPI', t, pct === 100 ? 'Done' : 'Due 31 Dec 2026', pct + '%'), { hasBar: true, bar: pct + '%' })), add('Add goal'), '48%'),
        rows('Reviews', 'Every review about this employee, newest cycle first.', [row('H1', 'H1 2026 · manager review', 'By ' + e.mgr, '4.6 / 5', 'Completed', 'ok'), row('H2', 'H2 2025 · manager review', 'By ' + e.mgr, '4.3 / 5', 'Completed', 'ok')], null, '48%'),
        { kind: 'chips', title: 'Skills & certifications', sub: '', basis: '100%', act: add('Add skill'), chips: ['TypeScript', 'Node.js', 'PostgreSQL', 'System design', 'AWS Certified Developer'] }
      ],
      exit: [
        kv('Current standing', '', [['Status', e.status], ['Notice period', '60 days'], ['Serving notice until', '—']], null, '48%'),
        { kind: 'steps', title: 'Lifecycle', sub: 'Dates recorded against this employment.', basis: '48%', rows: [['Joined', e.joined, 1], ['Probation ends', '12 Sep 2022', 1], ['Confirmed', '12 Sep 2022', 1], ['Notice started', 'Not started', 0]].map(([t, sub, d]) => ({ t, s: sub, done: !!d, todo: !d })) },
        kv('Separation details', 'Last working day must be on or after the notice start date.', [['Notice start date', '—'], ['Last working day', '—'], ['Exit type', '—'], ['Reason', '—']], { label: 'Edit separation details', go: () => toast('Opens separation details for ' + first) }),
        { kind: 'empty', title: 'Full & final settlement', sub: '', basis: '100%', empty: 'Starts once a last working day is set.' }
      ]
    };
    const list = tabs[p.tab] || [];
    return { secs: list.map(c => Object.assign({ kv: [], rows: [], chips: [], empty: '' }, c, { isKv: c.kind === 'kv', isRows: c.kind === 'rows', isSteps: c.kind === 'steps', isChips: c.kind === 'chips', isEmpty: c.kind === 'empty', hasSub: !!c.sub, hasN: !!c.n, n: c.n || '', hasAct: !!c.act, act: c.act ? c.act.label : '', go: c.act ? c.act.go : null, actD: c.act && /Edit|Change/.test(c.act.label) ? PT_EDIT : PT_PLUS })) };
  }
}
</script>
</body>
</html>
