<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./hrms-core.js"></script><script src="./hrms-fx.js"></script></helmet>
<div data-screen-label="{{ screen }}" style="box-sizing:border-box;width:100%;max-width:1440px;margin:0 auto;padding:26px clamp(16px,2.4vw,36px) 64px;display:flex;flex-direction:column;gap:20px;font-family:var(--u-font,'Geist',system-ui,sans-serif);color:var(--u-ink,#0E1B16)">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px"><div style="min-width:0;display:flex;flex-direction:column;gap:6px"><div style="font-size:13px;font-weight:500;color:var(--u-ink3,#6A7A73)">{{ crumb }}</div><h1 style="margin:0;color:inherit;font-size:28px;line-height:34px;font-weight:500;letter-spacing:-.025em">{{ title }}</h1><p style="margin:0;font-size:14px;color:var(--u-ink2,#4A5A54);text-wrap:pretty">{{ sub }}</p></div><div style="display:flex;flex-wrap:wrap;gap:8px"><sc-if value="{{ hasSec }}"><button type="button" onClick="{{ secGo }}" style="height:40px;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--u-ln,#E3E9E6);border-radius:11px;background:var(--u-sf,#fff);color:var(--u-ink,#0E1B16);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer" style-hover="border-color:var(--u-brl,#BFDFD1)">{{ secLabel }}</button></sc-if><sc-if value="{{ hasMain }}"><button type="button" onClick="{{ mainGo }}" style="height:40px;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 13px;border:0;border-radius:11px;background:#0F6E56;color:#fff;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 20px -12px rgba(15,110,86,.85)" style-hover="background:#0B5A46"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>{{ mainLabel }}</button></sc-if></div></div>
<dc-import name="UtSections" secs="{{ secs }}" style="display:block" hint-size="100%,600px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a-daily&quot;,&quot;a-analytics&quot;,&quot;a-shifts&quot;,&quot;cp-muster&quot;,&quot;l-ops&quot;,&quot;me-wfh&quot;,&quot;me-shift&quot;],&quot;default&quot;:&quot;a-analytics&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;tabLabel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onGo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Function&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(msg: string) =&gt; void&quot;}}">
const TM_PPL = [['Priya Sharma', 'Engineering'], ['Rahul Kumar', 'Sales'], ['Ananya Iyer', 'Design'], ['Vikram Singh', 'Operations'], ['Farah Khan', 'Support'], ['Arjun Nair', 'Operations'], ['Sneha Reddy', 'Design'], ['Mohammed Arif', 'Sales']];
class Component extends DCLogic {
  state = { done: {} };
  renderVals() {
    const p = this.props, s = this.state, empty = !!p.empty, tab = Number(p.tab) || 0, toast = m => { if (p.onToast) p.onToast(m); };
    const go = (mk, pk, tb) => () => { if (p.onGo) p.onGo(mk, pk, tb); };
    const act = (label, msg) => ({ label, go: () => toast(msg || label) });
    const E = arr => empty ? [] : arr;
    const decide = (id, name, what) => [{ label: 'Reject', go: () => { this.setState({ done: Object.assign({}, this.state.done, { [id]: 1 }) }); toast('Rejected ' + name.split(' ')[0] + '’s ' + what); } }, { label: 'Approve', main: true, go: () => { this.setState({ done: Object.assign({}, this.state.done, { [id]: 1 }) }); toast('Approved ' + name.split(' ')[0] + '’s ' + what); } }];
    const live = rows => rows.filter(r => !s.done[r.id]);
    const n0 = v => empty ? 0 : v;
    const month = (tagsFor) => { const out = []; const first = (new Date(2026, 8, 1).getDay() + 6) % 7; for (let i = 0; i < first; i++) out.push(null); for (let d = 1; d <= 30; d++) out.push({ n: d, tags: empty ? [] : (tagsFor(d) || []) }); while (out.length % 7) out.push(null); return out; };
    const P = {
      'a-daily': { crumb: 'Attendance & time', title: 'Daily tracking', tabs: [null,
        { sub: 'Punches that need a second look before payroll locks.', secs: [{ kind: 'table', title: 'Review list', n: n0(9), seg: ['Everything', 'Late & half days', 'Absent', 'Early & no check-out', 'Outside the zone', 'Face checks'], cols: ['Employee', 'Date', 'What happened', 'Source', 'Status'], emptyT: 'Nothing to review', emptyS: 'Everyone punched in and out on time.', rows: live(E([
          ['r1', 'Rahul Kumar · Sales', 'Fri, 25 Sep', 'Came in 09:52 · 22 min late', 'Mobile app (GPS)', ['Late', 'warn'], 'Late & half days'], ['r2', 'Farah Khan · Support', 'Fri, 25 Sep', 'No punch yet · not on leave', '—', ['Absent', 'bad'], 'Absent'],
          ['r3', 'Sneha Reddy · Design', 'Thu, 24 Sep', 'Left 15:10 · no half-day request', 'Web check-in', ['Early out', 'warn'], 'Early & no check-out'], ['r4', 'Arjun Nair · Operations', 'Fri, 25 Sep', 'Punched 1.2 km from Pune Office', 'Mobile app (GPS)', ['Outside zone', 'bad'], 'Outside the zone'],
          ['r5', 'Vikram Singh · Operations', 'Fri, 25 Sep', 'Face match 71% · below the 80% bar', 'Face check-in', ['Check face', 'info'], 'Face checks'], ['r6', 'Mohammed Arif · Sales', 'Wed, 23 Sep', 'No check-out recorded', 'Fingerprint device', ['No check-out', 'warn'], 'Early & no check-out']
        ]).map(([id, who, d, what, src, st, seg]) => ({ id, seg, cells: [who, d, what, src, st], acts: decide(id, who, 'punch') }))) }] },
        { sub: 'Add or correct a punch. Every change is stored on the record and shown in the audit log.', secs: [
          { kind: 'form', title: 'Manual attendance entry', w: 'half', fields: [['Employee', 'text', 'Search by name, code or email'], ['Date', 'date'], ['Came in', 'time'], ['Went out', 'time'], ['Status', 'select', ['Present', 'Half day', 'Work from home', 'On duty', 'Absent']], ['Reason', 'area', 'Stored on the record and shown in the audit log.']], submit: act('Save entry', 'Manual entry saved and added to the audit log') },
          { kind: 'table', title: 'Recent manual entries', w: 'half', cols: ['Employee', 'Date', 'Change', 'By'], emptyT: 'No manual entries yet', rows: E([['Kavya Menon · Engineering', 'Tue, 22 Sep', '09:30 → 18:30 · client site', 'Ishita Verma'], ['Rohan Das · Sales', 'Mon, 21 Sep', 'Marked on duty · travel', 'Neha Kapoor']]).map(r => ({ cells: r })) }] }] },
      'a-analytics': { crumb: 'Attendance & time', title: 'Attendance analytics', tabs: [
        { sub: 'How September is going across the company.', secs: [{ kind: 'stats', title: 'September so far', stats: [['Attendance rate', empty ? '0%' : '94.2%', 'Up 1.1% on August', 'ok'], ['Avg arrival', empty ? '—' : '09:21', '9 min before shift', 'ok'], ['Late marks', n0(212), 'Across 18 working days', 'warn'], ['Unplanned absence', empty ? '0%' : '2.8%', 'Target under 3%', 'bad']] },
          { kind: 'bars', title: 'Attendance by department', w: 'half', emptyT: 'No attendance yet', bars: E([['Engineering', '96%', 96], ['Design', '95%', 95], ['Finance', '95%', 95], ['Sales', '92%', 92, 'warn'], ['Support', '91%', 91, 'warn'], ['Operations', '89%', 89, 'warn']]) },
          { kind: 'bars', title: 'Attendance by branch', w: 'half', emptyT: 'No attendance yet', bars: E([['Bengaluru HQ', '95%', 95], ['Hyderabad', '93%', 93], ['Pune', '90%', 90, 'warn']]) }] },
        { sub: 'Who is often late, and when.', secs: [{ kind: 'table', title: 'Most late marks this month', cols: ['Employee', 'Late marks', 'Avg delay', 'Worst day', 'Trend'], emptyT: 'No late marks', rows: E([['Rahul Kumar · Sales', '7', '18 min', 'Mondays', ['Rising', 'bad']], ['Vikram Singh · Operations', '5', '24 min', 'Fridays', ['Steady', 'warn']], ['Arjun Nair · Operations', '4', '11 min', 'Tuesdays', ['Falling', 'ok']]]).map(r => ({ cells: r })) }] },
        { sub: 'Hours worked beyond the shift. Approved overtime is recorded, not paid, until payroll picks it up.', secs: [{ kind: 'stats', title: 'Overtime this month', stats: [['Hours logged', n0(186), '42 people', 'info'], ['Approved', n0(141), 'Ready for payroll', 'ok'], ['Waiting', n0(45), 'Needs a manager', 'warn']] },
          { kind: 'table', title: 'Overtime requests', cols: ['Employee', 'Date', 'Extra time', 'Reason', 'Status'], emptyT: 'No overtime requests', rows: live(E([['o1', 'Kavya Menon · Engineering', 'Thu, 24 Sep', '2h 30m', 'Release night', ['Waiting', 'warn']], ['o2', 'Farah Khan · Support', 'Wed, 23 Sep', '1h 45m', 'Escalation backlog', ['Waiting', 'warn']]]).map(([id, ...c]) => ({ id, cells: c, acts: decide(id, c[0], 'overtime') }))) }] }] },
      'a-shifts': { crumb: 'Attendance & time', title: 'Shifts & overtime', main: act('Add shift', 'Opens a new shift'), tabs: [
        { sub: 'Shift timings, grace periods and who works them.', secs: [{ kind: 'table', title: 'Shifts', cols: ['Shift', 'Timing', 'Grace', 'Weekly offs', 'People'], emptyT: 'No shifts yet', emptyS: 'Add a shift so lateness and overtime can be measured.', rows: E([['General · Default', '09:30 – 18:30', '15 min', 'Sat, Sun', '198'], ['Early · Support and Ops', '07:00 – 16:00', '10 min', 'Sun', '31'], ['Night · Support', '21:00 – 06:00', '15 min', 'Sat, Sun', '12']]).map(r => ({ cells: r, acts: [act('Edit')] })) }] },
        { sub: 'Who works which shift this week.', secs: [{ kind: 'table', title: 'Roster · 28 Sep – 4 Oct', cols: ['Employee', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'], emptyT: 'Nothing rostered', rows: E(TM_PPL.slice(0, 6).map(([n, d], i) => ({ cells: [n + ' · ' + d, i === 4 ? ['Night', 'info'] : ['General', 'ok'], i === 4 ? ['Night', 'info'] : ['General', 'ok'], i === 1 ? ['Leave', 'gray'] : ['General', 'ok'], ['General', 'ok'], i === 3 ? ['Early', 'warn'] : ['General', 'ok']] }))) }] },
        { sub: 'When extra time counts as overtime and how it is paid.', secs: [{ kind: 'kv', title: 'Overtime rules', act: act('Edit rules'), kv: [['Counts after', '30 min past shift end'], ['Weekday rate', '1.5× hourly'], ['Weekly off and holidays', '2× hourly'], ['Needs approval from', 'Reporting manager'], ['Monthly cap', '40 hours'], ['Paid through', 'Next pay run']] }] },
        { sub: 'Requests from employees who want to move shifts.', secs: [{ kind: 'table', title: 'Shift change requests', cols: ['Employee', 'From', 'To', 'Starting from', 'Status'], emptyT: 'No shift-change requests yet', rows: live(E([['s1', 'Farah Khan · Support', 'General', 'Evening', 'Thu, 1 Oct', ['Waiting', 'warn']], ['s2', 'Arjun Nair · Operations', 'Early', 'General', 'Mon, 5 Oct', ['Waiting', 'warn']]]).map(([id, ...c]) => ({ id, cells: c, acts: decide(id, c[0], 'shift change') }))) }] }] },
      'cp-muster': { crumb: 'Compliance', title: 'Muster roll', sec: act('Previous day'), main: act('Download muster', 'Downloading the muster roll for Fri, 25 Sep'), tabs: [
        { sub: 'Fri, 25 Sep 2026 · all departments · statutory register of who worked.', secs: [{ kind: 'stats', title: 'How the day splits', stats: [['Present', n0(142), '', 'ok'], ['Late', n0(8), '', 'warn'], ['Half day', n0(3), '', 'warn'], ['On leave', n0(12), '', 'info'], ['Work from home', n0(45), '', 'info'], ['Not marked yet', n0(18), '', 'gray'], ['Absent', n0(24), '', 'bad'], ['Weekly off', n0(0), 'Friday is a working day', 'gray']] },
          { kind: 'table', title: 'On the roster', n: n0(241), cols: ['Employee', 'Shift', 'In', 'Out', 'Hours', 'Status'], emptyT: 'No one on the roster', emptyS: 'Add people and shifts to fill the muster roll.', rows: E([['Priya Sharma · EMP-0101', 'General', '09:24', '—', '4h 46m', ['Present', 'ok']], ['Rahul Kumar · EMP-0114', 'General', '09:52', '—', '4h 18m', ['Late', 'warn']], ['Ananya Iyer · EMP-0121', 'General', '09:18', '—', '4h 52m', ['Work from home', 'info']], ['Kavya Menon · EMP-0163', 'General', '—', '—', '—', ['On leave', 'info']], ['Farah Khan · EMP-0172', 'General', '—', '—', '—', ['Not marked yet', 'gray']]]).map(r => ({ cells: r })) }] }] },
      'l-ops': { crumb: 'Leave', title: 'Leave operations center', main: act('Apply for someone', 'Apply leave on behalf of an employee'), tabs: [null,
        { sub: 'Requests you or other approvers have already decided.', secs: [{ kind: 'table', title: 'Decided', seg: ['All', 'Approved', 'Rejected'], cols: ['Employee', 'Type', 'Dates', 'Decided by', 'Result'], emptyT: 'No decisions yet', rows: E([['Mohammed Arif · Sales', 'Earned leave', '14–18 Sep · 5 days', 'Rohan Das', ['Approved', 'ok'], 'Approved'], ['Sneha Reddy · Design', 'Sick leave', 'Mon, 21 Sep', 'Ananya Iyer', ['Approved', 'ok'], 'Approved'], ['Rohan Das · Sales', 'Casual leave', 'Tue, 29 Sep', 'You', ['Rejected', 'bad'], 'Rejected']]).map(r => ({ seg: r[5], cells: r.slice(0, 5) })) }] },
        { sub: 'What each person has left, after pending requests.', secs: [{ kind: 'table', title: 'Balances', cols: ['Employee', 'Casual', 'Earned', 'Sick', 'Comp-off'], emptyT: 'No leave balances yet', rows: E([['Priya Sharma · Engineering', '4.5 / 12', '9 / 15', '6 / 8', '1'], ['Rahul Kumar · Sales', '7 / 12', '12 / 15', '8 / 8', '0'], ['Kavya Menon · Engineering', '6 / 12', '5 / 15', '7 / 8', '2'], ['Vikram Singh · Operations', '2 / 12', '11 / 15', '4 / 8', '0']]).map(r => ({ cells: r })) }] },
        { sub: 'Who is away on approved leave this month.', secs: [{ kind: 'cal', title: 'September 2026', days: month(d => ({ 2: [['Gandhi Jayanti eve', 'gray']], 10: [['Priya · EL', 'info']], 11: [['Priya · EL', 'info']], 18: [['Vikram · CL', 'info']], 21: [['Sneha · SL', 'warn']], 25: [['Kavya · EL', 'info'], ['+2 more', 'gray']], 28: [['Priya · CL', 'info']], 29: [['Priya · CL', 'info']] })[d]) }] },
        { sub: 'Turn unused earned leave into pay. Approved requests are paid with the next salary.', secs: [{ kind: 'stats', title: 'Encashment', stats: [['Can encash now', n0(186) + ' days', 'Across encashable leave types', 'ok'], ['Waiting for HR', n0(3), 'Waiting for a decision', 'warn'], ['Approved, to be paid', n0(2), 'Paid with your next salary', 'info']] },
          { kind: 'table', title: 'Encashment requests', cols: ['Employee', 'Leave type', 'Days', 'Amount', 'Status'], emptyT: 'No encashment requests yet', rows: live(E([['e1', 'Rahul Kumar · Sales', 'Earned leave', '5', '₹14,200', ['Waiting for HR', 'warn']], ['e2', 'Neha Kapoor · Marketing', 'Earned leave', '8', '₹31,800', ['Waiting for HR', 'warn']], ['e3', 'Ishita Verma · Finance', 'Earned leave', '4', '₹12,900', ['Paid through payroll', 'ok']]]).map(([id, ...c]) => ({ id, cells: c, acts: c[4][1] === 'warn' ? decide(id, c[0], 'encashment') : [] }))) }] },
        { sub: 'Monthly credits and what carries into next year.', secs: [{ kind: 'kv', title: 'Monthly and quarterly credits', w: 'half', kv: [['Casual leave', '1 day a month'], ['Earned leave', '1.25 days a month'], ['Sick leave', '2 days a quarter'], ['Next credit', 'Thu, 1 Oct 2026']] },
          { kind: 'stats', title: 'Year-end carry forward', w: 'half', stats: [['Carried forward', n0(1240) + ' days', 'Earned leave', 'ok'], ['Lapses', n0(386) + ' days', 'Casual leave', 'bad'], ['Above the caps', n0(12), 'People over 30 days', 'warn']] }] },
        { sub: 'The leave types people can apply for, and their rules.', secs: [{ kind: 'table', title: 'Leave types', cols: ['Leave type', 'Days a year', 'Carry forward', 'Encashable', 'Status'], emptyT: 'No leave types yet', rows: E([['Casual leave · CL', '12', 'No', 'No', ['Active', 'ok']], ['Earned leave · EL', '15', 'Up to 30 days', 'Yes', ['Active', 'ok']], ['Sick leave · SL', '8', 'No', 'No', ['Active', 'ok']], ['Comp-off · CO', 'As earned', 'Expires in 90 days', 'No', ['Active', 'ok']], ['Maternity leave · ML', '182', 'No', 'No', ['Active', 'ok']]]).map(r => ({ cells: r, acts: [act('Edit'), act('Deactivate', 'Deactivated ' + r[0].split(' · ')[0])] })), act: act('Add leave type') }] },
        { sub: 'Public and optional holidays for 2026.', secs: [{ kind: 'table', title: 'Holiday calendar', n: n0(14), act: act('Add Holiday'), cols: ['Holiday', 'Date', 'Day', 'Applies to', 'Type'], emptyT: 'No holidays yet', rows: E([['Gandhi Jayanti', 'Fri, 2 Oct', 'Friday', 'All branches', ['Public', 'ok']], ['Dussehra', 'Tue, 20 Oct', 'Tuesday', 'All branches', ['Public', 'ok']], ['Diwali', 'Sun, 8 Nov', 'Sunday', 'All branches', ['Public', 'ok']], ['Guru Nanak Jayanti', 'Tue, 24 Nov', 'Tuesday', 'Pune', ['Optional', 'gray']], ['Christmas', 'Fri, 25 Dec', 'Friday', 'All branches', ['Public', 'ok']]]).map(r => ({ cells: r })) }] }] },
      'me-wfh': { crumb: 'My workspace', title: 'Work from home', tabs: [
        { sub: 'Ask to work from home on one or more days.', secs: [{ kind: 'form', title: 'New request', sub: 'Your approver is notified as soon as you send it.', w: 'half', fields: [['From', 'date'], ['To', 'date'], ['Reason', 'area', 'At least 10 characters']], submit: act('Send request', 'Work-from-home request sent to Siddharth Rao') },
          { kind: 'kv', title: 'How it works', sub: 'What an approved day changes', w: 'half', kv: [['Punch', 'From anywhere, no geofence'], ['Counts as', 'Present'], ['Allowance', '8 days a month'], ['Used this month', empty ? '0 days' : '3 days']] },
          { kind: 'table', title: 'My requests', cols: ['Dates', 'Days', 'Reason', 'Status'], emptyT: 'No work-from-home requests yet', rows: E([['Wed, 30 Sep', '1', 'Plumber visit', ['Waiting', 'warn']], ['10–11 Sep', '2', 'Travel back from Pune', ['Approved', 'ok']]]).map(r => ({ cells: r })) }] }] },
      'me-shift': { crumb: 'My workspace', title: 'Shift change', tabs: [
        { sub: 'Ask to move to another shift from a date.', secs: [{ kind: 'kv', title: 'Your shift', w: 'half', kv: [['Shift', 'General'], ['Timing', '09:30 – 18:30'], ['Grace', '15 min'], ['Weekly offs', 'Sat, Sun']] },
          { kind: 'form', title: 'New request', w: 'half', fields: [['New shift', 'select', ['Early · 07:00–16:00', 'Night · 21:00–06:00']], ['Starting from', 'date'], ['Reason', 'area', 'At least 10 characters']], submit: act('Send request', 'Shift-change request sent') },
          { kind: 'table', title: 'My requests', cols: ['Change', 'Starting from', 'Reason', 'Status'], emptyT: 'No shift-change requests yet', rows: [] }] }] }
    };
    const pg = P[p.page] || P['a-analytics'], tb = pg.tabs[Math.min(tab, pg.tabs.length - 1)] || pg.tabs.find(Boolean);
    return {
      screen: pg.title + (p.tabLabel ? ' · ' + p.tabLabel : ''), crumb: pg.crumb, title: pg.title, sub: tb.sub,
      hasMain: !!pg.main, mainLabel: pg.main ? pg.main.label : '', mainGo: pg.main ? pg.main.go : null,
      hasSec: !!pg.sec, secLabel: pg.sec ? pg.sec.label : '', secGo: pg.sec ? pg.sec.go : null,
      secs: tb.secs
    };
  }
}
</script>
</body>
</html>
