<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./hrms-fx.js"></script></helmet>
<div data-fx="tilt" data-rise="" role="button" tabindex="0" onClick="{{ go }}" style="position:relative;height:100%;min-height:138px;box-sizing:border-box;padding:16px 16px 15px;border-radius:16px;background:var(--u-sf,#fff);border:1px solid var(--u-ln,#E3E9E6);box-shadow:var(--u-shc,0 1px 2px rgba(14,27,22,.05));cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:14px;overflow:hidden;font-family:var(--u-font,'Geist',system-ui,sans-serif);color:var(--u-ink,#0E1B16);outline:none;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(calc(var(--fx,0) * -3px));transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s" style-hover="box-shadow:var(--u-shh,0 20px 40px -22px rgba(15,110,86,.5));border-color:var(--u-brl,#BFDFD1)" style-focus="box-shadow:0 0 0 3px rgba(15,110,86,.25)">
<span aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;opacity:var(--fx,0);transition:opacity .35s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(15,110,86,.11),transparent 45%)"></span>
<span aria-hidden="true" style="position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:var(--fxr,0);transition:opacity .35s;background:conic-gradient(from var(--ang,0deg),transparent 0deg 200deg,rgba(15,110,86,.35) 250deg,#0F6E56 305deg,#8FD9BE 335deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude"></span>
<div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
<span style="width:54px;height:54px;flex-shrink:0;border-radius:15px;background:var(--u-brs,#E8F3EE);display:flex;align-items:center;justify-content:center;transition:background .35s">
<sc-if value="{{ kUser }}" hint-placeholder-val="{{ true }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><circle cx="19" cy="16" r="6.5" style="fill:var(--u-sf,#fff)"></circle><path d="M7 36c1.2-6.5 6-10 12-10s10.8 3.5 12 10z" style="fill:var(--u-sf,#fff)"></path><g style="transform-origin:33px 13px;transform:scale(calc(.85 + var(--fx,0) * .2)) rotate(calc(var(--fx,0) * 90deg));transition:transform .55s cubic-bezier(.34,1.56,.64,1)"><circle cx="33" cy="13" r="7" stroke="none" style="fill:var(--u-br,#0F6E56)"></circle><path d="M33 10v6M30 13h6" stroke="#fff" stroke-width="2"></path></g></svg></sc-if>
<sc-if value="{{ kCoins }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><rect x="6" y="30" width="22" height="7" rx="3.5" style="fill:var(--u-sf,#fff)"></rect><rect x="8" y="23" width="22" height="7" rx="3.5" style="fill:var(--u-sf,#fff)"></rect><g style="transform:translateY(calc((1 - var(--fx,0)) * -9px));opacity:calc(.3 + var(--fx,0) * .7);transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .3s"><rect x="7" y="16" width="22" height="7" rx="3.5" style="fill:var(--u-gds,#FAF1E1);stroke:var(--u-gd,#C8912E)"></rect></g><g style="transform-origin:35px 12px;transform:rotate(calc(var(--fx,0) * 360deg));transition:transform .9s cubic-bezier(.65,0,.35,1)"><circle cx="35" cy="12" r="7" style="fill:var(--u-gds,#FAF1E1);stroke:var(--u-gd,#C8912E)"></circle><path d="M32.5 9.5h5M32.5 11.5h5M33 9.5c3 0 3 4 0 4l2.8 2.8" stroke-width="1.4" style="stroke:var(--u-gd,#C8912E)"></path></g></svg></sc-if>
<sc-if value="{{ kCal }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><rect x="7" y="9" width="30" height="28" rx="5" style="fill:var(--u-sf,#fff)"></rect><path d="M7 17h30M15 6v6M29 6v6"></path><path d="M15 28l4.5 4.5 9-9.5" stroke-width="2.2" pathLength="1" stroke-dasharray="1" style="stroke:var(--u-br,#0F6E56);stroke-dashoffset:calc(1 - var(--fx,0));transition:stroke-dashoffset .5s .28s cubic-bezier(.2,.8,.2,1)"></path><g style="transform-origin:22px 18px;transform:scaleY(calc(1 - var(--fx,0)));transition:transform .45s cubic-bezier(.65,0,.35,1)"><rect x="9" y="18.5" width="26" height="16.5" rx="3" stroke="none" style="fill:var(--u-brs2,#D2EADF)"></rect><path d="M14 23.5h2M21 23.5h2M28 23.5h2M14 29.5h2M21 29.5h2" stroke-width="2.2"></path></g></svg></sc-if>
<sc-if value="{{ kClock }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><circle cx="22" cy="24" r="14" style="fill:var(--u-sf,#fff)"></circle><path d="M18 5h8M22 5v5M34.5 11.5 37 9"></path><path d="M22 13.5v1.5M22 33v1.5M11.5 24H13M31 24h1.5" stroke-width="1.6"></path><g style="transform-origin:22px 24px;transform:rotate(calc(var(--fx,0) * 360deg));transition:transform 1.2s cubic-bezier(.65,0,.35,1)"><path d="M22 24v-7.5" stroke-width="2.2" style="stroke:var(--u-br,#0F6E56)"></path></g><g style="transform-origin:22px 24px;transform:rotate(calc(var(--fx,0) * 60deg));transition:transform 1.2s cubic-bezier(.65,0,.35,1)"><path d="M22 24l4.5 3" stroke-width="2.2" style="stroke:var(--u-gd,#C8912E)"></path></g><circle cx="22" cy="24" r="1.8" stroke="none" style="fill:var(--u-br,#0F6E56)"></circle></svg></sc-if>
<sc-if value="{{ kMega }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><path d="M8 19v7a2.5 2.5 0 0 0 2.5 2.5H13l9 6.5V10l-9 6.5h-2.5A2.5 2.5 0 0 0 8 19z" style="fill:var(--u-sf,#fff)"></path><path d="M14 28.5l2 6.5"></path><path d="M27 18.5a6 6 0 0 1 0 8" style="opacity:calc(.4 + var(--fx,0) * .6);transform:translateX(calc(var(--fx,0) * 1.5px));transition:all .35s"></path><path d="M30.5 15a11 11 0 0 1 0 15" style="opacity:var(--fx,0);transform:translateX(calc(var(--fx,0) * 2px));transition:all .35s .08s"></path><path d="M34 11.5a16 16 0 0 1 0 22" style="stroke:var(--u-gd,#C8912E);opacity:var(--fx,0);transform:translateX(calc(var(--fx,0) * 2.5px));transition:all .35s .16s"></path></svg></sc-if>
<sc-if value="{{ kChart }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><rect x="6" y="7" width="32" height="30" rx="5" style="fill:var(--u-sf,#fff)"></rect><rect x="11" y="23" width="4.5" height="9" rx="1.2" stroke="none" style="fill:var(--u-brs2,#D2EADF);transform-box:fill-box;transform-origin:bottom;transform:scaleY(calc(.55 + var(--fx,0) * .45));transition:transform .5s cubic-bezier(.34,1.56,.64,1)"></rect><rect x="17.8" y="18" width="4.5" height="14" rx="1.2" stroke="none" style="fill:var(--u-brs2,#D2EADF);transform-box:fill-box;transform-origin:bottom;transform:scaleY(calc(.55 + var(--fx,0) * .45));transition:transform .5s .06s cubic-bezier(.34,1.56,.64,1)"></rect><rect x="24.6" y="21" width="4.5" height="11" rx="1.2" stroke="none" style="fill:var(--u-brs2,#D2EADF);transform-box:fill-box;transform-origin:bottom;transform:scaleY(calc(.55 + var(--fx,0) * .45));transition:transform .5s .12s cubic-bezier(.34,1.56,.64,1)"></rect><rect x="31.2" y="14" width="4.5" height="18" rx="1.2" stroke="none" style="fill:var(--u-br,#0F6E56);transform-box:fill-box;transform-origin:bottom;transform:scaleY(calc(.55 + var(--fx,0) * .45));transition:transform .5s .18s cubic-bezier(.34,1.56,.64,1)"></rect><path d="M11 17l7-4 7 3 9-6" pathLength="1" stroke-dasharray="1" style="stroke:var(--u-gd,#C8912E);stroke-dashoffset:calc(1 - var(--fx,0));transition:stroke-dashoffset .6s .2s"></path></svg></sc-if>
<sc-if value="{{ kHome }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><path d="M7 20.5 22 8l15 12.5V35a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" style="fill:var(--u-sf,#fff)"></path><rect x="12" y="22" width="8" height="7" rx="1.5" stroke-width="1.6" style="fill:var(--u-gd,#C8912E);fill-opacity:calc(var(--fx,0) * .55);transition:fill-opacity .35s"></rect><path d="M26 37v-9h6v9"></path><path d="M30 12.5V7h4v8.8"></path><path d="M32 4.5c-1.2-1.2 1.2-1.8 0-3" stroke-width="1.4" style="opacity:var(--fx,0);transform:translateY(calc((1 - var(--fx,0)) * 3px));transition:all .5s .15s"></path></svg></sc-if>
<sc-if value="{{ kDown }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><path d="M11 6h14l8 8v22a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" style="fill:var(--u-sf,#fff)"></path><path d="M25 6v8h8M14 17h6"></path><g style="transform:translateY(calc(var(--fx,0) * 3px));transition:transform .45s cubic-bezier(.34,1.56,.64,1)"><path d="M21 21v9M17 26.5l4 4 4-4" stroke-width="2.2" style="stroke:var(--u-br,#0F6E56)"></path></g><path d="M15.5 34h11" style="stroke:var(--u-gd,#C8912E);opacity:calc(.35 + var(--fx,0) * .65);transition:opacity .3s .15s"></path></svg></sc-if>
<sc-if value="{{ kSwap }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><circle cx="22" cy="22" r="15" style="fill:var(--u-sf,#fff)"></circle><g style="transform-origin:22px 22px;transform:rotate(calc(var(--fx,0) * 180deg));transition:transform .7s cubic-bezier(.65,0,.35,1)"><path d="M14 18.5h15l-4-4" stroke-width="2"></path><path d="M30 25.5H15l4 4" stroke-width="2" style="stroke:var(--u-gd,#C8912E)"></path></g></svg></sc-if>
<sc-if value="{{ kMail }}"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--u-brt,#0F6E56);overflow:visible"><rect x="6" y="17" width="32" height="20" rx="2.5" style="fill:var(--u-sf,#fff)"></rect><g style="transform:translateY(calc(var(--fx,0) * -7px));transition:transform .55s .08s cubic-bezier(.34,1.56,.64,1)"><rect x="11" y="9" width="22" height="20" rx="2" style="fill:var(--u-sf,#fff)"></rect><path d="M15 14h14M15 18h9" stroke-width="1.6"></path></g><path d="M6 19.5 22 30l16-10.5V34.5a2.5 2.5 0 0 1-2.5 2.5h-27A2.5 2.5 0 0 1 6 34.5z" style="fill:var(--u-brs2,#D2EADF)"></path></svg></sc-if>
</span>
<sc-if value="{{ hasBadge }}"><span style="height:22px;padding:0 9px;border-radius:999px;background:var(--u-gds,#FAF1E1);color:var(--u-gdt,#8A5A10);font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap">{{ badge }}</span></sc-if>
</div>
<div style="position:relative;min-width:0;padding-right:18px">
<div style="font-size:14px;line-height:18px;font-weight:500;letter-spacing:-.005em">{{ label }}</div>
<div style="margin-top:3px;font-size:12.5px;line-height:16px;color:var(--u-ink3,#6A7A73);text-wrap:pretty">{{ hint }}</div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;right:0;bottom:1px;color:var(--u-brt,#0F6E56);opacity:var(--fx,0);transform:translateX(calc((1 - var(--fx,0)) * -6px));transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:150},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;user&quot;,&quot;coins&quot;,&quot;calendar&quot;,&quot;clock&quot;,&quot;megaphone&quot;,&quot;chart&quot;,&quot;home&quot;,&quot;download&quot;,&quot;swap&quot;,&quot;mail&quot;],&quot;default&quot;:&quot;calendar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Approve leave&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9 requests waiting&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;go&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, k = p.kind || 'user';
    return {
      kUser: k === 'user', kCoins: k === 'coins', kCal: k === 'calendar', kClock: k === 'clock', kMega: k === 'megaphone', kChart: k === 'chart',
      kHome: k === 'home', kDown: k === 'download', kSwap: k === 'swap', kMail: k === 'mail',
      label: p.label || '', hint: p.hint || '', badge: p.badge || '', hasBadge: !!p.badge,
      go: () => { if (p.go) p.go(); }
    };
  }
}
</script>
</body>
</html>
