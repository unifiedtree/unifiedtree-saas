<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./hrms-fx.js"></script></helmet>
<div data-screen-label="Page frame" style="box-sizing:border-box;width:100%;max-width:1440px;margin:0 auto;padding:28px clamp(16px,2.4vw,36px) 56px;display:flex;flex-direction:column;gap:20px;font-family:var(--u-font,'Geist',system-ui,sans-serif);color:var(--u-ink,#0E1B16)">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px"><div style="min-width:0;display:flex;flex-direction:column;gap:6px"><div style="font-size:13px;font-weight:500;color:var(--u-ink3,#6A7A73)">{{ modLabel }}</div><h1 style="margin:0;color:inherit;font-size:28px;line-height:34px;font-weight:500;letter-spacing:-.025em">{{ title }}</h1><p style="margin:0;font-size:14.5px;line-height:21px;color:var(--u-ink2,#4A5A54)">This page isn’t designed yet. It will use the same header, stat cards and table card as the others.</p></div><div style="display:flex;gap:8px"><span style="width:110px;height:38px;border-radius:10px;border:1px solid var(--u-ln,#E3E9E6);background:var(--u-sf,#fff)"></span><span style="width:130px;height:38px;border-radius:10px;background:var(--u-brs2,#D2EADF)"></span></div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><sc-for list="{{ four }}" as="x" hint-placeholder-count="4"><div data-rise="" style="height:132px;box-sizing:border-box;padding:18px;border-radius:16px;background:var(--u-sf,#fff);border:1px solid var(--u-ln,#E3E9E6);display:flex;flex-direction:column;justify-content:space-between"><span style="width:42px;height:42px;border-radius:50%;background:var(--u-hv,#F0F4F2)"></span><div style="display:flex;flex-direction:column;gap:8px"><span style="width:52%;height:10px;border-radius:5px;background:var(--u-hv,#F0F4F2)"></span><span style="width:34%;height:18px;border-radius:6px;background:var(--u-ln,#E3E9E6)"></span></div></div></sc-for></div>
<div data-rise="" style="border-radius:16px;background:var(--u-sf,#fff);border:1px solid var(--u-ln,#E3E9E6);overflow:hidden"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px"><span style="width:180px;height:14px;border-radius:6px;background:var(--u-ln,#E3E9E6)"></span><span style="width:220px;height:34px;border-radius:10px;background:var(--u-hv,#F0F4F2)"></span></div><sc-for list="{{ rows }}" as="r" hint-placeholder-count="6"><div style="display:grid;grid-template-columns:36px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 90px;align-items:center;gap:16px;padding:14px 20px;box-shadow:inset 0 1px 0 var(--u-ln2,#EDF1EF)"><span style="width:34px;height:34px;border-radius:50%;background:var(--u-hv,#F0F4F2)"></span><span style="height:10px;border-radius:5px;background:var(--u-hv,#F0F4F2);width:64%"></span><span style="height:10px;border-radius:5px;background:var(--u-hv,#F0F4F2);width:46%"></span><span style="height:10px;border-radius:5px;background:var(--u-hv,#F0F4F2);width:60%"></span><span style="height:22px;border-radius:999px;background:var(--u-brs,#E8F3EE)"></span></div></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const title = (p.pageLabel || 'Page') + (p.tabLabel ? ' · ' + p.tabLabel : '');
    return { modLabel: p.modLabel || '', title, four: [1, 2, 3, 4], rows: ['70%', '48%', '62%', '55%', '76%', '44%'].map((a, i) => ({ a, b: ['40%', '58%', '46%', '66%', '38%', '52%'][i] })) };
  }
}
</script>
</body>
</html>
