<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script><script src="./hrms-fx.js"></script></helmet>
<div style="position:relative;width:100%;height:100%;min-height:96px">
<span aria-hidden="true" style="position:absolute;left:14%;right:14%;bottom:2%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(15,110,86,.28),transparent);transform:scale(calc(1 - var(--fx,0) * .14));opacity:calc(.8 - var(--fx,0) * .25);transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .5s"></span>
<div style="position:absolute;inset:0 0 8% 0;transform:translateY(calc(var(--fx,0) * -8px)) rotate(calc(var(--fx,0) * -3deg)) scale(calc(1 + var(--fx,0) * .05));transition:transform .7s cubic-bezier(.34,1.56,.64,1)">
<div data-float="" style="width:100%;height:100%"><image-slot id="{{ slot }}" placeholder="{{ label }}" shape="rounded" radius="18" fit="contain" style="width:100%;height:100%"></image-slot></div>
</div>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="position:absolute;top:4%;right:6%;pointer-events:none;color:var(--u-gd,#C8912E);transform:scale(var(--fx,0)) rotate(calc(var(--fx,0) * 90deg));transition:transform .45s .1s cubic-bezier(.34,1.56,.64,1)"><path d="M12 0c.8 6.4 4.8 10.6 12 12-7.2 1.4-11.2 5.6-12 12-.8-6.4-4.8-10.6-12-12C7.2 10.6 11.2 6.4 12 0z" fill="currentColor"></path></svg>
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" style="position:absolute;top:30%;left:2%;pointer-events:none;color:var(--u-brt,#0F6E56);transform:scale(var(--fx,0)) rotate(calc(var(--fx,0) * -90deg));transition:transform .45s .2s cubic-bezier(.34,1.56,.64,1)"><path d="M12 0c.8 6.4 4.8 10.6 12 12-7.2 1.4-11.2 5.6-12 12-.8-6.4-4.8-10.6-12-12C7.2 10.6 11.2 6.4 12 0z" fill="currentColor"></path></svg>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" style="position:absolute;bottom:18%;right:2%;pointer-events:none;color:var(--u-gd,#C8912E);transform:scale(var(--fx,0)) rotate(calc(var(--fx,0) * 90deg));transition:transform .45s .3s cubic-bezier(.34,1.56,.64,1)"><path d="M12 0c.8 6.4 4.8 10.6 12 12-7.2 1.4-11.2 5.6-12 12-.8-6.4-4.8-10.6-12-12C7.2 10.6 11.2 6.4 12 0z" fill="currentColor"></path></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:160},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ut-art-demo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Drop 3D art&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { slot: p.slot || 'ut-art', label: p.label || 'Drop 3D art' };
  }
}
</script>
</body>
</html>
