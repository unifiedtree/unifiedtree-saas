          { kind: 'bars', title: 'Used so far', emptyT: 'No leave taken yet', bars: E([['Casual leave', '7.5 of 12', 63, 'warn'], ['Earned leave', '6 of 15', 40], ['Sick leave', '2 of 8', 25], ['Comp-off', '0 of 1', 0]]) }] },
        { sub: 'Your requests, newest first, with where each one stands.', secs: [
          { kind: 'table', title: 'Requests', plain: true, cols: ['Leave', 'Dates', 'Days', 'Approver', 'Status'], emptyT: 'No leave requests yet', rows: E([['lr1', 'Casual leave', '28 – 29 Sep', '2', 'Siddharth Rao', 'Pending'], ['lr2', 'Sick leave', 'Thu, 3 Sep', '1', 'Siddharth Rao', 'Approved'], ['lr3', 'Earned leave', '10 – 14 Aug', '5', 'Siddharth Rao', 'Approved'], ['lr4', 'Casual leave', 'Fri, 17 Jul', '1', 'Siddharth Rao', 'Rejected']].map(([id, ...c]) => { const cx = s.done[id]; const st = cx ? 'Cancelled' : c[4]; return { cells: c.slice(0, 4).concat([[st, st === 'Approved' ? 'ok' : st === 'Pending' ? 'warn' : st === 'Rejected' ? 'bad' : 'gray']]), acts: st === 'Pending' ? [one(id, 'Cancel', 'Leave request cancelled', false)] : [] }; })) }] }] }
    };
    const V = {
      cycle: () => ({ title: 'New review cycle', sub: 'Reviews go out to every reviewer on the start date.', secs: [{ kind: 'form', title: 'Cycle', fields: [['Title', 'text', 'H2 2026 appraisal'], ['Period from', 'date', '', '', '2026-10-01'], ['Period to', 'date', '', '', '2027-03-31'], ['Who reviews', 'select', ['Manager + self review', 'Manager only', 'Manager, self and peers (360°)']], ['Due date', 'date'], ['Rating scale', 'select', ['1 to 5', '1 to 4', 'No rating, comments only']]], submit: { label: 'Create cycle', go: close('Review cycle created') } }] }),
      review: c => { const r = GR_REV.find(x => x[0] === c) || GR_REV[2], sub = r[5] === 'Submitted'; return { title: 'Review · ' + r[1].split(' · ')[0], sub: r[2] + ' · by ' + r[3], secs: [{ kind: 'kv', title: sub ? 'Reviews and feedback' : 'Waiting for the reviewer’s feedback.', kv: sub ? [['Rating', r[4] + ' of 5'], ['Strengths', 'Takes ownership and communicates clearly with every team.'], ['Areas to improve', 'Share context earlier when plans change.'], ['Submitted', 'Tue, 22 Sep']] : [['Reviewer', r[3]], ['Due', 'Wed, 30 Sep'], ['Status', 'Not submitted']] }] }; },
      write: c => ({ title: 'Write review · ' + (c === 'w1' ? 'Kavya Menon' : 'Aditya Rao'), sub: 'Q3 2026 check-in · due Wed, 30 Sep', secs: [{ kind: 'form', title: 'Review', fields: [['Rating', 'select', ['4 · Exceeds', '5 · Outstanding', '3 · Meets', '2 · Needs support', '1 · Below']], ['What went well', 'area', 'Specific examples from this quarter'], ['What to focus on next', 'area', 'One or two things for next quarter']], submit: { label: 'Submit review', go: () => { mark(c); close('Review submitted')(); } } }] }),
      goal: () => ({ title: 'Add a goal', sub: 'Link it to a company KPI so progress rolls up.', secs: [{ kind: 'form', title: 'Goal', fields: [['Goal', 'text', 'Give the goal a title'], ['Description', 'area', 'Optional'], ['Weight', 'number', '25', 'Weight must be a whole number from 0 to 100'], ['Company KPI', 'select', ['None', 'Ship payroll automation', 'Cut API p95 to 200 ms', 'CSAT above 4.5', 'Q3 revenue ₹4.5 Cr']], ['Due date', 'date']], submit: { label: 'Add goal', go: close('Goal added') } }] }),
      progress: () => ({ title: 'Update progress', sub: 'Ship payroll automation', secs: [{ kind: 'form', title: 'Progress', w: 'half', fields: [['Progress (%)', 'number', '', '', '80'], ['What changed since the last update?', 'area', 'Bank file export is live for HDFC']], submit: { label: 'Save', go: close('Progress saved') } }, { kind: 'table', title: 'Progress history', plain: true, w: 'half', cols: ['Date', 'Progress', 'Note'], rows: cells([['14 Sep', '72%', 'Payslip PDFs done'], ['31 Aug', '60%', 'LOP from attendance'], ['10 Aug', '35%', 'Salary components']]) }] }),
      prog: () => ({ title: 'New training program', sub: 'People can enroll from Programs once it’s saved.', secs: [{ kind: 'form', title: 'Program', fields: [['Company', 'select', ['Demo Technologies Pvt Ltd', 'Demo Retail Pvt Ltd']], ['Title', 'text', 'Manager essentials'], ['Category', 'select', ['Leadership', 'Technical', 'Compliance', 'Finance', 'Support']], ['Trainer', 'text', 'Optional'], ['Starts', 'date'], ['Ends', 'date'], ['Seats', 'number', 'Unlimited'], ['Mode', 'select', ['Online', 'Classroom', 'On site']], ['Description', 'area', 'Optional']], submit: { label: 'Create program', go: close('Training program created') } }] }),
      enroll: c => ({ title: 'Enroll people', sub: c, secs: [{ kind: 'form', title: 'Enroll', w: 'half', fields: [['Search employees to enroll', 'text', 'Search name or code']], submit: act('Enroll', 'Enrolled') }, { kind: 'table', title: 'Enrollments', w: 'half', cols: ['Employee', 'Score', 'Status'], rows: [['e1', 'Priya Sharma · Engineering', '—', ['Enrolled', 'info']], ['e2', 'Kavya Menon · Engineering', '—', ['Enrolled', 'info']], ['e3', 'Aditya Rao · Engineering', '84%', ['Completed', 'ok']]].filter(r => !s.done[r[0]]).map(([id, ...r]) => ({ cells: r, acts: r[2][0] === 'Completed' ? [] : [one(id, 'Drop', 'Dropped from the program', false)] })) }] }),
      skill: () => ({ title: 'Propose a skill', sub: 'Your manager approves the level before it shows on your record.', secs: [{ kind: 'form', title: 'Skill', fields: [['Skill name', 'text', 'React', 'Saving a skill name that already exists updates it.'], ['Proficiency', 'select', ['Intermediate', 'Beginner', 'Advanced', 'Expert']], ['Certification name', 'text', 'Optional'], ['Note for your manager (optional)', 'area', 'What you built with it']], submit: { label: 'Propose a level', go: close('Skill proposed. Your manager is notified') } }] }),
      notice: c => { const r = GR_NOTICE.find(x => x[0] === c); return { title: r ? 'Edit dates · ' + r[1].split(' · ')[0] : 'Start notice period', sub: 'Last working day must be on or after the notice start date.', sec: r ? { label: 'Withdraw notice', go: () => { close('Notice withdrawn. ' + first(r[1]) + ' is active again')(); } } : null, secs: [{ kind: 'form', title: 'Notice', fields: [['Employee', 'text', 'Type at least 2 characters of a name, code or email', '', r ? r[1] : ''], ['Notice start date', 'date'], ['Last working day', 'date'], ['Exit type', 'select', ['Resignation', 'Termination', 'Retirement', 'End of contract']], ['Reason', 'area', 'Not shared with the employee']], submit: { label: r ? 'Save dates' : 'Start notice', go: close('Separation details saved') } }] }; },
      reg: () => ({ title: 'Request regularisation', sub: 'Fix a missed or wrong punch. Your manager approves it.', secs: [{ kind: 'form', title: 'Correction', fields: [['Date', 'date', '', '', '2026-09-17'], ['Came in', 'time', '', '', '09:30'], ['Went out', 'time', '', '', '19:05'], ['Reason', 'area', 'Traffic on ORR; badge reader was down']], submit: { label: 'Send request', go: close('Regularisation request sent to Siddharth Rao') } }] }),
      apply: () => ({ title: 'Apply for leave', sub: 'Your approver is notified as soon as you send it.', secs: [{ kind: 'form', title: 'Leave', w: 'half', fields: [['Leave type', 'select', ['Casual leave', 'Earned leave', 'Sick leave', 'Comp-off']], ['From', 'date'], ['To', 'date'], ['Half day', 'select', ['No', 'First half', 'Second half']], ['Reason', 'area', 'Optional']], submit: { label: 'Send request', go: close('Leave request sent to Siddharth Rao') } }, { kind: 'kv', title: 'You have', w: 'half', kv: [['Casual leave', '4.5 days'], ['Earned leave', '9 days'], ['Sick leave', '6 days'], ['Approver', 'Siddharth Rao']] }] })
    };
    const pg = P[p.page] || P['p-center'];
    const tb = pg.tabs[Math.min(tab, pg.tabs.length - 1)] || pg.tabs[0];
    const vv = s.view && V[s.view.key] ? V[s.view.key](s.view.ctx) : null;
    const main = vv ? vv.main : (tb.main || pg.main), sec = vv ? vv.sec : (tb.sec || pg.sec), ic = main ? main.icon || 'plus' : '';
    return {
      screen: pg.title + (vv ? ' · ' + vv.title : p.tabLabel ? ' · ' + p.tabLabel : ''), crumb: pg.crumb, title: vv ? vv.title : pg.title, sub: vv ? vv.sub : tb.sub,
      inView: !!vv, notView: !vv, backLabel: pg.title + (p.tabLabel ? ' · ' + p.tabLabel : ''), back: close(),
      hasMain: !!main, mainLabel: main ? main.label : '', mainGo: main ? main.go : null, mPlus: ic === 'plus', mCheck: ic === 'check', mDown: ic === 'down', mArrow: ic === 'arrow',
      hasSec: !!sec, secLabel: sec ? sec.label : '', secGo: sec ? sec.go : null,
      secs: vv ? vv.secs : tb.secs
    };
  }
}
</script>
