# =============================================================================
# 'canonical-prod' profile - production-grade JWT auth on top of canonical
# Activate with: SPRING_PROFILES_ACTIVE=canonical,canonical-prod
#
# Differences from plain 'canonical':
#  - X-Tenant-ID header is REFUSED. Tenant identity comes only from signed JWT.
#  - JWT secret must come from env var UNIFIEDTREE_JWT_SECRET (>= 32 chars).
#  - CanonicalSecurityConfig (smoke) refuses to load. CanonicalProdSecurityConfig
#    activates with @EnableMethodSecurity.
# =============================================================================
# Face attendance: the canonical attendance-face module (Python worker at
# UNIFIEDTREE_FACE_WORKER_URL) is the ONE source of biometric verification. The
# mobile app verifies via /v1/attendance/face/checkin BEFORE calling /checkin, so
# the LEGACY in-process face check inside AttendanceService.checkInJson (which
# calls a non-existent localhost:8085 sidecar and otherwise throws FACE_MISMATCH)
# must be OFF on canonical-prod — otherwise every face check-in fails after a
# successful scan and no attendance record is written.
hrms:
  face-recognition:
    enabled: ${HRMS_FACE_RECOGNITION_ENABLED:false}
  attendance:
    # Outside-zone punches are HARD-BLOCKED in production. The mobile app
    # detects the zone violation pre-flight and shows a warning popup, but
    # this server-side gate is the source of truth — a tampered client cannot
    # bypass it. To disable per-tenant override later, expose this on a
    # settings page; for now it is a global env flip.
    geofence-enforce: ${HRMS_GEOFENCE_ENFORCE:true}

spring:
  flyway:
    # Production NEVER loads db/dev-seed. Explicitly override so a forgotten
    # dependency or build artifact change cannot leak demo users into prod.
    locations: classpath:db/canonical
  jpa:
    hibernate:
      ddl-auto: validate
    # Base 'canonical' profile turns SQL + bind-parameter logging ON for smoke
    # debugging. In prod that logs every statement AND the actual bound PII
    # values (emails, names, tenant ids) on every query — a perf drain and a
    # PII-in-logs leak. Force it OFF here.
    show-sql: false
    properties:
      hibernate:
        default_schema: ''
        format_sql: false
  # Bound multipart uploads (employee documents, letter attachments). Face
  # images travel as base64 JSON, not multipart, but any document upload path
  # must not be unbounded — an unbounded upload is a trivial memory-exhaustion
  # DoS. 10 MB comfortably covers a scanned PDF / photo.
  servlet:
    multipart:
      max-file-size: ${UNIFIEDTREE_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${UNIFIEDTREE_MAX_REQUEST_SIZE:12MB}
  # Graceful shutdown: on Cloud Run / rolling deploys the container gets a
  # SIGTERM, then a grace window before SIGKILL. Draining in-flight requests
  # (a punch, a payroll run) instead of dropping them is what makes deploys
  # zero-downtime. Spring stops accepting new requests and lets running ones
  # finish, up to the timeout below.
  lifecycle:
    timeout-per-shutdown-phase: 30s

unifiedtree:
  # Invitation / password-reset email links. In production these MUST point at
  # the public frontend, never localhost. InvitationService.buildUrl prepends the
  # tenant subdomain, e.g. https://{slug}.unifiedtree.com/accept-invite?token=...
  # Set INVITE_URL_BASE if the platform frontend is hosted on a different domain.
  mail:
    invite-url-base: ${INVITE_URL_BASE:https://${UNIFIEDTREE_BASE_DOMAIN:unifiedtree.com}}

  security:
    rls:
      enabled: true
    # Header fallback DISABLED. JWT-only.
    allow-tenant-header: false

  cors:
    # PRODUCTION must set this. Empty/missing -> the canonical-prod CORS
    # config rejects every cross-origin request (fail-safe). Comma-separated
    # list, no wildcards. Example:
    #   UNIFIEDTREE_ALLOWED_ORIGINS=https://app.unifiedtree.com,https://admin.unifiedtree.com
    allowed-origins: ${UNIFIEDTREE_ALLOWED_ORIGINS:}
    # Controlled wildcard patterns for tenant subdomains. Use this for
    # https://company1.unifiedtree.com, https://src.unifiedtree.com, etc.
    # Example:
    #   UNIFIEDTREE_ALLOWED_ORIGIN_PATTERNS=https://*.unifiedtree.com
    allowed-origin-patterns: ${UNIFIEDTREE_ALLOWED_ORIGIN_PATTERNS:}
    # JWT bearer flow does NOT need credentials=true. Only set to true if
    # introducing a cookie-session flow in addition.
    allow-credentials: ${UNIFIEDTREE_CORS_ALLOW_CREDENTIALS:false}

  jwt:
    # MUST be set in the environment in production. The fallback below is
    # intentionally invalid (too short) so a misconfigured deploy refuses to
    # start, rather than running with a known weak secret.
    secret: ${UNIFIEDTREE_JWT_SECRET:CHANGE_ME}
    issuer: ${UNIFIEDTREE_JWT_ISSUER:unifiedtree}
    access-ttl-minutes:  ${UNIFIEDTREE_JWT_ACCESS_TTL_MIN:720}   # 12h — long enough for a full working session (refresh endpoint not yet implemented)
    refresh-ttl-days:    ${UNIFIEDTREE_JWT_REFRESH_TTL_DAYS:7}

  # ---------------------------------------------------------------------
  # Face verification (canonical attendance.face_* + Python worker)
  # ---------------------------------------------------------------------
  face:
    enabled:              ${UNIFIEDTREE_FACE_ENABLED:true}
    worker-url:           ${UNIFIEDTREE_FACE_WORKER_URL:http://localhost:8091}
    # READ timeout. The face worker is its own scale-to-zero Railway service;
    # the first verify after idle pays an ONNX model-load + inference cost, so
    # 1500ms was far too tight (cold punch -> 503 FACE_WORKER_UNAVAILABLE).
    worker-timeout-ms:    ${UNIFIEDTREE_FACE_WORKER_TIMEOUT_MS:12000}
    # CONNECT timeout. Must tolerate Railway holding the socket open while the
    # worker container boots. Previously capped at 750ms which a cold worker
    # could never meet. Kept well under the mobile 60s checkin timeout.
    worker-connect-timeout-ms: ${UNIFIEDTREE_FACE_WORKER_CONNECT_TIMEOUT_MS:12000}
    # Identity match floor. 0.85 (raw cosine ~0.70) was rejecting genuine
    # faces under everyday lighting/angle variance — well above SFace's own
    # recommended operating point (~0.68 in this 0..1 space). 0.75 keeps a
    # comfortable margin above that recommendation (secure) while no longer
    # punishing correct faces. Tune per tenant later via the env var.
    match-threshold:      ${UNIFIEDTREE_FACE_MATCH_THRESHOLD:0.75}
    # Best-vs-mean gap: across all enrolled templates the arithmetic mean
    # must be >= match-threshold - this value. Defends against single-angle
    # lucky matches by impostors.
    match-mean-gap:       ${UNIFIEDTREE_FACE_MATCH_MEAN_GAP:0.05}
    # Quorum: how loose an enrolled template can score and still "agree".
    match-template-gap:   ${UNIFIEDTREE_FACE_MATCH_TEMPLATE_GAP:0.04}
    # Number of agreeing templates required for PASS. Enrollment now captures
    # 3 angles (not 5), so quorum 4 collapsed to "all 3 must agree" — the
    # strictest possible, a big source of false rejects. 2-of-3 still blocks
    # a stranger who can only fool one angle, while tolerating a bad frame.
    match-quorum:         ${UNIFIEDTREE_FACE_MATCH_QUORUM:2}
    min-quality:          ${UNIFIEDTREE_FACE_MIN_QUALITY:0.55}
    require-liveness:     ${UNIFIEDTREE_FACE_REQUIRE_LIVENESS:true}
    liveness-threshold:   ${UNIFIEDTREE_FACE_LIVENESS_THRESHOLD:0.35}
    # A locked enrolment now auto-clears after a cooldown (see face.lockout-
    # cooldown-minutes) so a run of bad frames no longer needs a manager.
    lockout-failure-count: ${UNIFIEDTREE_FACE_LOCKOUT_FAILURES:8}
    lockout-cooldown-minutes: ${UNIFIEDTREE_FACE_LOCKOUT_COOLDOWN_MINUTES:30}
    model-name:           ${UNIFIEDTREE_FACE_MODEL_NAME:sface}
    model-version:        ${UNIFIEDTREE_FACE_MODEL_VERSION:sface-1.0}
    raw-image-retention-days: ${UNIFIEDTREE_FACE_RAW_RETENTION_DAYS:7}
    # 32-byte AES-GCM key, base64. App refuses to start if missing.
    # Generate with: openssl rand -base64 32
    encryption-key:       ${UNIFIEDTREE_FACE_ENCRYPTION_KEY:}

  # ---------------------------------------------------------------------
  # In-app notifications + Expo push (platform-notifications module)
  # ---------------------------------------------------------------------
  # Expo Push accepts unauthenticated sends against exp.host; no API key is
  # required for the current release. If we later want per-project
  # rate-limit isolation we can add an EXPO_ACCESS_TOKEN header — for now
  # the default is fine. Flip EXPO_PUSH_ENABLED=false to short-circuit
  # every push send (in-app rows still persist).
  push:
    expo:
      url:     ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
      enabled: ${EXPO_PUSH_ENABLED:true}

# =============================================================================
# Production hardening — overrides base application.yml / application-canonical.yml
# =============================================================================
server:
  # Bind graceful shutdown to the SIGTERM the orchestrator sends. Pairs with
  # spring.lifecycle.timeout-per-shutdown-phase above.
  shutdown: graceful

# Actuator lockdown. Base application.yml exposes health,info,metrics,prometheus
# with health show-details: always — i.e. /actuator/prometheus and /actuator/metrics
# are world-readable and leak internal topology + per-endpoint latency, and the
# health payload leaks DB/vendor details to anonymous callers. In prod, expose
# ONLY health + info, and never reveal health internals to unauthenticated
# callers. Cloud Run/GCP uptime checks only need HTTP 200 on /api/actuator/health.
# (To scrape Prometheus later, expose it on a separate management port bound to
# the private VPC, not the public ingress — documented in MONITORING.md.)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        # Kubernetes/Cloud Run style liveness + readiness groups, served at
        # /api/actuator/health/liveness and /health/readiness.
        enabled: true
  info:
    env:
      enabled: false

# Swagger / OpenAPI OFF in production. The base profile ships springdoc, which
# publishes the full API surface at /swagger-ui.html + /v3/api-docs. That's a
# reconnaissance aid for an attacker and has no place in a production build.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production logging. The base 'canonical' profile sets com.unifiedtree=DEBUG,
# org.hibernate.SQL=DEBUG and the bind-parameter binder to TRACE (logs real PII).
# Reset to production-sane levels here. Structured/JSON logging for Cloud Logging
# is opt-in via LOGGING_PATTERN or a logback-spring.xml (see DEPLOYMENT.md).
logging:
  level:
    root: INFO
    com.unifiedtree: ${LOG_LEVEL_APP:INFO}
    com.hrms: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
