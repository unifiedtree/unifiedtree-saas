name: Canonical Integration Tests

# Focused gate for all canonical IT classes.
# Each class spins up its own Testcontainers Postgres (no external services needed).
# Covers: AttendanceFlowIT (5) + LeaveFlowIT (5) + AuditControllerIT (5) + LetterFlowIT (8) = 23 tests.
# Target runtime: under 8 minutes from push to green checkmark.

on:
  push:
    branches: ['**']
    paths:
      - 'backend/modules/hrms-attendance/**'
      - 'backend/modules/hrms-leave/**'
      - 'backend/modules/hrms-letters/**'
      - 'backend/app/hrms-api/src/main/java/com/hrms/api/attendance/**'
      - 'backend/app/hrms-api/src/main/java/com/hrms/api/leave/**'
      - 'backend/app/hrms-api/src/main/java/com/hrms/api/audit/**'
      - 'backend/app/hrms-api/src/main/java/com/hrms/api/letters/**'
      - 'backend/app/hrms-app/src/test/java/com/hrms/app/AttendanceFlowIT.java'
      - 'backend/app/hrms-app/src/test/java/com/hrms/app/LeaveFlowIT.java'
      - 'backend/app/hrms-app/src/test/java/com/hrms/audit/AuditControllerIT.java'
      - 'backend/app/hrms-app/src/test/java/com/hrms/letters/LetterFlowIT.java'
      - 'backend/app/hrms-app/src/main/resources/db/canonical/**'
      # Without this, editing the workflow itself matches no path and the
      # gate silently does not run — a change here looks green by not running.
      - '.github/workflows/attendance-leave-it.yml'
      # test-init.sql creates the DB roles and grants every IT depends on, and
      # was likewise missing here: a commit touching only it did not run the
      # gate, which reads as "no result" rather than as a skip.
      - 'backend/app/hrms-app/src/test/resources/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

concurrency:
  group: canonical-it-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-it:
    name: Canonical IT (23 tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build all modules (skip tests)
        working-directory: backend
        run: |
          mvn -B install -DskipTests \
            -pl "modules/hrms-attendance,modules/hrms-leave,modules/hrms-letters,app/hrms-api,app/hrms-app" \
            -am

      - name: Run canonical integration tests
        working-directory: backend
        run: |
          mvn -B -pl app/hrms-app test \
            -Dtest="AttendanceFlowIT,LeaveFlowIT,AuditControllerIT,LetterFlowIT" \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          # Testcontainers detects Docker socket automatically on ubuntu-latest.
          # Disable Ryuk to avoid permission issues on restricted runners.
          TESTCONTAINERS_RYUK_DISABLED: "true"

          # These ITs run @ActiveProfiles({"canonical","canonical-prod"}), and
          # application-canonical-prod.yml deliberately leaves the face key
          # empty so production cannot boot on a known key. That empty value
          # layers over the dev fallback in application-canonical.yml, so
          # EmbeddingCipher's @PostConstruct throws and every context fails.
          # Supplying it here keeps the guard in the prod profile intact.
          # Must decode to EXACTLY 32 bytes (AES-256) — a 35-byte literal is
          # what broke boot last time. This is the in-repo dev value and is
          # not a secret; real deploys override it from Secret Manager.
          UNIFIEDTREE_FACE_ENCRYPTION_KEY: "ZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kISEhISE="

          # FirebaseAdminConfig is @ConditionalOnProperty(..., matchIfMissing
          # = true), so Firebase Admin starts unless told otherwise and then
          # dies on absent Google credentials. Setting it here covers every
          # module at once; per-class properties drifted once already
          # (AuditControllerIT and LetterFlowIT were missed). Tests never
          # send a push notification.
          UNIFIEDTREE_FIREBASE_ENABLED: "false"

          # SubscriptionAccessGuard (the LIVE copy is com.hrms.api.saasguard,
          # not the unscanned com.hrms.api.saas one) returns 402
          # subscription_lapsed when a tenant has no ledger row, which is every
          # request these ITs make — nothing in the fixtures creates a
          # subscription. The guard already allows a tenant with no row if it is
          # grandfathered, so list the two fixture tenants (TENANT_A / TENANT_B
          # in AbstractIntegrationTest) rather than inventing subscription rows
          # whose shape the tests would then have to keep in step.
          UNIFIEDTREE_SUBSCRIPTION_GRANDFATHER_TENANT_IDS: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa,bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-canonical-it
          path: backend/app/hrms-app/target/surefire-reports/
          retention-days: 7
