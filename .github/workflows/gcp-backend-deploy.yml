# =============================================================================
# Backend CI/CD — build + deploy the Spring Boot API to Cloud Run.
#
# Keyless auth via Workload Identity Federation (no JSON key in GitHub secrets).
# One-time setup (run once, then store the two values as repo variables):
#
#   gcloud iam workload-identity-pools create github --location=global
#   gcloud iam workload-identity-pools providers create-oidc github-oidc \
#     --location=global --workload-identity-pool=github \
#     --issuer-uri=https://token.actions.githubusercontent.com \
#     --attribute-mapping=google.subject=assertion.sub,attribute.repository=assertion.repository \
#     --attribute-condition="assertion.repository=='unifiedtree/unifiedtree-saas'"
#   gcloud iam service-accounts add-iam-policy-binding ut-deployer@$PROJECT.iam.gserviceaccount.com \
#     --role=roles/iam.workloadIdentityUser \
#     --member="principalSet://iam.googleapis.com/projects/$PN/locations/global/workloadIdentityPools/github/attribute.repository/unifiedtree/unifiedtree-saas"
#
# Repo → Settings → Variables (Actions):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER (full resource name), GCP_DEPLOYER_SA
#
# Only touches the backend. Does NOT build or deploy the website.
# =============================================================================
name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/gcp-backend-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: cloudrun-backend
  cancel-in-progress: false   # never cancel a half-finished prod deploy

env:
  SERVICE: unifiedtree-saas
  IMAGE_REPO: ut-images
  IMAGE_NAME: hrms-backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compile + run the test suite BEFORE building the deploy image.
      - name: Build & test
        working-directory: backend
        run: mvn -B -ntp -pl app/hrms-app -am verify
        env:
          # The integration tests boot the canonical-prod profile, which deliberately
          # refuses to start on missing secrets (so production can never run on a
          # known key). Supply test-only values here instead of weakening that profile.
          # Same settings as attendance-leave-it.yml; keep the two in step.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # AES-256 key for EmbeddingCipher: must decode to EXACTLY 32 bytes. In-repo dev
          # value, not a secret; production reads it from Secret Manager.
          UNIFIEDTREE_FACE_ENCRYPTION_KEY: "ZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kISEhISE="
          # canonical-prod defaults this to CHANGE_ME (9 chars), which fails startup by
          # design; EmployeeSearchIT is the one class that does not override it.
          UNIFIEDTREE_JWT_SECRET: "integration-test-only-jwt-secret-must-be-32-plus-chars"
          # FirebaseAdminConfig is matchIfMissing = true and dies without Google credentials.
          UNIFIEDTREE_FIREBASE_ENABLED: "false"
          # The live SubscriptionAccessGuard (com.hrms.api.saasguard) answers 402 for any
          # tenant with no subscription row. Grandfather every fixture tenant the ITs use:
          # TENANT_A, TENANT_B (AbstractIntegrationTest) and T1-T4 (FreshTenantLeaveFlowIT).
          UNIFIEDTREE_SUBSCRIPTION_GRANDFATHER_TENANT_IDS: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa,bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb,11110000-0000-0000-0000-000000000001,22220000-0000-0000-0000-000000000002,33330000-0000-0000-0000-000000000003,44440000-0000-0000-0000-000000000004"

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image (Cloud Build)
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${IMAGE_REPO}/${IMAGE_NAME}:${GITHUB_SHA::12}"
          gcloud builds submit backend --tag "$IMAGE" --project "${{ vars.GCP_PROJECT_ID }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy revision
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet
          # Startup probe gates traffic; a failed rollout keeps the old revision live.

      - name: Smoke test
        # The service's run.app URL answers 404 to everything (ingress is
        # internal-and-cloud-load-balancing) and actuator lives on a separate
        # management port, so neither can be reached from here. Check instead
        # that the new revision is the one actually serving -- `gcloud run deploy`
        # can report success while the revision dies on startup and traffic stays
        # on the old one -- then that the public API answers through the load
        # balancer.
        run: |
          REGION="${{ vars.GCP_REGION }}"; PROJECT="${{ vars.GCP_PROJECT_ID }}"
          read -r READY CREATED < <(gcloud run services describe "$SERVICE" --region "$REGION"               --project "$PROJECT" --format='value(status.latestReadyRevisionName,status.latestCreatedRevisionName)')
          echo "latestReady=$READY latestCreated=$CREATED"
          [ "$READY" = "$CREATED" ] || { echo "new revision is not serving"; exit 1; }
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}'               "https://api.unifiedtree.com/api/v1/public/workspace-status?subdomain=demo-hrms" || true)
            [ "$code" = "200" ] && echo "public API OK on $READY" && exit 0
            sleep 6
          done
          echo "public API check failed (last status $code)"; exit 1
