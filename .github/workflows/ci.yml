name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  PNPM_VERSION: '9'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/**'
              - 'packages/**'
              - 'platform/shared/**'
              - 'pnpm-lock.yaml'
            backend:
              - 'backend/**'
              # Without this, a change to the test settings below skips the very
              # job it changes, and the run reports success having tested nothing.
              - '.github/workflows/ci.yml'

  frontend-lint-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  frontend-build:
    needs: frontend-lint-typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [website, platform, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.app }} build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          retention-days: 1

  backend-build-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unifiedtree_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/unifiedtree_test
          DB_USERNAME: nexus
          DB_PASSWORD: nexus
          REDIS_HOST: localhost
          JWT_SECRET: test-secret-key-minimum-256-bits-long-for-testing
          # The integration tests boot the canonical-prod profile, which deliberately
          # refuses to start on missing secrets (so production can never run on a
          # known key). Supply test-only values here instead of weakening that profile.
          # Same settings as attendance-leave-it.yml; keep the two in step.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # AES-256 key for EmbeddingCipher: must decode to EXACTLY 32 bytes. In-repo dev
          # value, not a secret; production reads it from Secret Manager.
          UNIFIEDTREE_FACE_ENCRYPTION_KEY: "ZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kISEhISE="
          # canonical-prod defaults this to CHANGE_ME (9 chars), which fails startup by
          # design; EmployeeSearchIT is the one class that does not override it.
          UNIFIEDTREE_JWT_SECRET: "integration-test-only-jwt-secret-must-be-32-plus-chars"
          # FirebaseAdminConfig is matchIfMissing = true and dies without Google credentials.
          UNIFIEDTREE_FIREBASE_ENABLED: "false"
          # The live SubscriptionAccessGuard (com.hrms.api.saasguard) answers 402 for any
          # tenant with no subscription row. Grandfather every fixture tenant the ITs use:
          # TENANT_A, TENANT_B (AbstractIntegrationTest) and T1-T4 (FreshTenantLeaveFlowIT).
          UNIFIEDTREE_SUBSCRIPTION_GRANDFATHER_TENANT_IDS: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa,bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb,11110000-0000-0000-0000-000000000001,22220000-0000-0000-0000-000000000002,33330000-0000-0000-0000-000000000003,44440000-0000-0000-0000-000000000004"

  docker-build:
    needs: [frontend-build, backend-build-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: website
            dockerfile: docker/Dockerfile.website
          - image: platform
            dockerfile: docker/Dockerfile.platform
          - image: admin
            dockerfile: docker/Dockerfile.admin
          - image: backend
            dockerfile: docker/Dockerfile.backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/unifiedtree-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
