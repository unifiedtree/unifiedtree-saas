<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- White label: this page is served on every workspace's own address, so
         nothing here names the vendor. The app replaces the title with
         "<Page> - <Workspace>" and the icon with the workspace's mark or
         monogram as soon as it knows the workspace (workspaceBranding.ts);
         until then the icon is a plain tile in the rail's green. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c5a45'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <meta name="description" content="Sign in to your workspace for HR, attendance, payroll and more." />
    <meta property="og:title" content="Sign in to your workspace" />
    <meta property="og:description" content="HR, attendance, payroll and more." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sign in to your workspace" />
    <meta name="twitter:description" content="HR, attendance, payroll and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Tabler Icons webfont — client HR design uses ti ti-* icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" />
    <!-- No-flash theme script: reads ut.theme from localStorage and sets data-theme BEFORE paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ut.theme') || 'system';
          var resolved = t === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
