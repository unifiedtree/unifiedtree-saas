<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- White label: this page is served on every workspace's own address, so
         nothing here names the vendor. The app replaces the title with
         "<Page> - <Workspace>" and the icon with the workspace's mark or
         monogram as soon as it knows the workspace (workspaceBranding.ts);
         until then the icon is a plain tile in the rail's green. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c5a45'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <meta name="description" content="Sign in to your workspace for HR, attendance, payroll and more." />
    <meta property="og:title" content="Sign in to your workspace" />
    <meta property="og:description" content="HR, attendance, payroll and more." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sign in to your workspace" />
    <meta name="twitter:description" content="HR, attendance, payroll and more." />
    <!-- One typeface for the whole app: Inter, 400/500/600 only (nothing
         heavier can render). Codes and IDs use the system monospace. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- No-flash theme: applies the saved light/dark choice ('ut.theme', default
         light; the sign-in pages always light) and the default motion level
         BEFORE paint. Same rules as src/design/theme/theme.ts — keep the two in step. -->
    <script>
      (function () {
        var d = document.documentElement, t = 'light';
        try { if (localStorage.getItem('ut.theme') === 'dark') t = 'dark'; } catch (_) {}
        if (/^\/(login|forgot-password|reset-password|accept-invite|pending-approval)(\/|$)/.test(location.pathname)) t = 'light';
        d.setAttribute('data-theme', t);
        d.style.colorScheme = t;
        if (!d.hasAttribute('data-ufx')) d.setAttribute('data-ufx', 'full');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
